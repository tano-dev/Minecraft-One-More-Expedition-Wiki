  <title>Daily Quests — One More Expedition Wiki</title>
  <link rel="icon" type="image/png" href="assets/server-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/wiki-header.css" />
  <script src="assets/wiki-lang-sync.js"></script>
  <style>
    :root {
      --bg-dark: #0d131f;
      --card-bg: rgba(18, 24, 38, 0.9);
      --border-card: rgba(255, 255, 255, 0.1);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --gold-primary: #f5c451;
      --aqua: #38bdf8;
      --green: #4ade80;
      --epic: #e879f9;
      --red: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.55;
      background-color: var(--bg-dark);
      position: relative;
      -webkit-font-smoothing: antialiased;
    }
    .minecraft-bg-fixed {
      position: fixed;
      inset: 0;
      z-index: -10;
      pointer-events: none;
      background: #101726 url('assets/bg.jpg') no-repeat center center / cover;
    }
    .minecraft-bg-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 25%, rgba(15, 23, 42, 0.48) 0%, rgba(7, 10, 18, 0.88) 100%);
    }
    .mc-pixel { image-rendering: pixelated; image-rendering: crisp-edges; }
    .page-wrap { max-width: 1260px; margin: 0 auto; padding: 24px 20px 64px; }
    .back-bar { margin-bottom: 18px; }
    .back-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 14px; border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1; text-decoration: none; font-size: 0.85rem; font-weight: 700;
      transition: all 0.2s;
    }
    .back-btn:hover { background: rgba(245, 196, 81, 0.14); border-color: rgba(245, 196, 81, 0.45); color: var(--gold-primary); }

    .hero-card {
      background: linear-gradient(135deg, rgba(24, 34, 54, 0.94), rgba(15, 23, 38, 0.96));
      border: 1px solid rgba(245, 196, 81, 0.28);
      border-radius: 18px;
      padding: 24px 28px;
      display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.45);
      margin-bottom: 20px;
    }
    .hero-icon-box {
      width: 68px; height: 68px; border-radius: 16px;
      background: rgba(245, 196, 81, 0.12);
      border: 1px solid rgba(245, 196, 81, 0.35);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .hero-icon-box img { width: 44px; height: 44px; }
    .hero-title { font-size: 1.7rem; font-weight: 800; color: #fef08a; line-height: 1.2; }
    .hero-sub { color: #93c5fd; font-size: 0.92rem; font-weight: 700; margin-top: 4px; }
    .hero-desc { color: var(--text-muted); font-size: 0.85rem; margin-top: 6px; max-width: 780px; }

    /* Overview 4-grid */
    .overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }
    .info-card {
      background: var(--card-bg);
      border: 1px solid var(--border-card);
      border-radius: 14px;
      padding: 16px 18px;
    }
    .info-head {
      display: flex; align-items: center; gap: 10px;
      font-size: 0.96rem; font-weight: 800; color: #fef08a;
      margin-bottom: 10px;
    }
    .info-head img { width: 20px; height: 20px; }
    .info-list {
      list-style: none; display: flex; flex-direction: column; gap: 6px;
      font-size: 0.82rem; color: #cbd5e1;
    }
    .info-list code {
      font-family: 'JetBrains Mono', monospace;
      background: rgba(255, 255, 255, 0.08);
      padding: 1px 6px; border-radius: 5px; color: #fde68a; font-size: 0.78rem;
    }

    /* Filter Panel */
    .filter-panel {
      background: var(--card-bg);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 18px;
    }
    .search-row {
      display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 14px;
    }
    .search-box { flex: 1 1 300px; position: relative; display: flex; align-items: center; }
    .search-box .search-ico { position: absolute; left: 13px; width: 16px; height: 16px; pointer-events: none; }
    .search-box input {
      width: 100%; padding: 10px 36px 10px 38px; border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(10, 15, 25, 0.85); color: var(--text-main);
      font-size: 0.9rem; font-family: inherit; outline: none;
    }
    .search-box input:focus { border-color: var(--gold-primary); }
    .clear-btn {
      position: absolute; right: 10px; background: none; border: none;
      color: var(--text-muted); cursor: pointer; font-size: 0.9rem; display: none;
    }
    .filter-select {
      padding: 9px 12px; border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(10, 15, 25, 0.88); color: var(--text-main);
      font-size: 0.85rem; font-family: inherit; cursor: pointer;
    }
    .chip-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .chip-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.04); color: #cbd5e1;
      font-size: 0.8rem; font-weight: 700; cursor: pointer; font-family: inherit;
      transition: all 0.15s;
    }
    .chip-btn img { width: 14px; height: 14px; }
    .chip-btn:hover { border-color: rgba(245, 196, 81, 0.45); color: #fef08a; }
    .chip-btn.active { background: rgba(245, 196, 81, 0.2); border-color: var(--gold-primary); color: #fde68a; }

    .results-bar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px; font-size: 0.85rem; color: var(--text-muted); flex-wrap: wrap; gap: 8px;
    }

    .quests-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(335px, 1fr));
      gap: 14px;
    }
    .quest-card {
      background: var(--card-bg);
      border: 1px solid var(--border-card);
      border-radius: 14px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex; flex-direction: column; gap: 10px;
    }
    .quest-card:hover {
      border-color: rgba(245, 196, 81, 0.55);
      transform: translateY(-2px);
      background: rgba(24, 33, 52, 0.95);
    }
    .card-top { display: flex; align-items: flex-start; gap: 12px; }
    .q-icon-wrap {
      width: 44px; height: 44px; border-radius: 10px;
      background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .q-icon-wrap img { width: 28px; height: 28px; }
    .q-title { font-size: 0.98rem; font-weight: 800; line-height: 1.25; }
    .q-sub { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

    .badge-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 8px; border-radius: 6px; font-size: 0.72rem; font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.12); background: rgba(255, 255, 255, 0.06); color: #e2e8f0;
    }
    .diff-EASY { color: #4ade80; border-color: rgba(74, 222, 128, 0.42); background: rgba(74, 222, 128, 0.12); }
    .diff-MEDIUM { color: #f5c451; border-color: rgba(245, 196, 81, 0.42); background: rgba(245, 196, 81, 0.12); }
    .diff-HARD { color: #f87171; border-color: rgba(248, 113, 113, 0.45); background: rgba(248, 113, 113, 0.14); }
    .dim-pill { color: #bae6fd; border-color: rgba(56, 189, 248, 0.35); background: rgba(56, 189, 248, 0.12); }
    .reward-pill { color: #fde68a; border-color: rgba(245, 196, 81, 0.35); background: rgba(245, 196, 81, 0.1); }
    .q-desc { font-size: 0.82rem; color: #cbd5e1; }
    .q-target-list {
      display: flex; flex-direction: column; gap: 5px;
      background: rgba(10, 14, 23, 0.55); border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px; padding: 8px;
    }
    .q-target-row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 4px 6px; border-radius: 7px; background: rgba(255, 255, 255, 0.03);
      font-size: 0.8rem; color: #e2e8f0;
    }
    .q-target-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .q-target-left img { width: 20px; height: 20px; flex-shrink: 0; }
    .q-target-name { font-weight: 600; line-height: 1.25; }
    .q-qty-pill {
      font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; font-weight: 700;
      padding: 2px 7px; border-radius: 6px; white-space: nowrap; flex-shrink: 0;
      background: rgba(56, 189, 248, 0.14); border: 1px solid rgba(56, 189, 248, 0.35); color: #bae6fd;
    }
    .q-qty-pill.boss {
      background: rgba(248, 113, 113, 0.16); border-color: rgba(248, 113, 113, 0.45); color: #fecaca;
    }
    .q-foot {
      margin-top: auto; padding-top: 8px;
      border-top: 1px dashed rgba(255, 255, 255, 0.08);
      font-size: 0.76rem; color: #93c5fd;
      display: flex; justify-content: space-between; gap: 8px;
    }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(5, 8, 15, 0.82); backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center; z-index: 2000; padding: 18px;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      width: 100%; max-width: 620px; max-height: 90vh; overflow-y: auto;
      background: #121928; border: 1px solid rgba(245, 196, 81, 0.38);
      border-radius: 18px; padding: 24px; position: relative;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
    }
    .modal-close {
      position: absolute; top: 16px; right: 16px; width: 32px; height: 32px;
      border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06); color: #e2e8f0; cursor: pointer; font-size: 1rem;
    }
    .modal-header { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; padding-right: 36px; }
    .modal-icon-big {
      width: 56px; height: 56px; border-radius: 14px;
      background: rgba(0, 0, 0, 0.45); border: 1px solid rgba(245, 196, 81, 0.35);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .modal-icon-big img { width: 38px; height: 38px; }
    .modal-section {
      background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px; padding: 14px 16px; margin-bottom: 12px;
    }
    .modal-sec-title {
      font-size: 0.76rem; font-weight: 800; text-transform: uppercase;
      color: var(--gold-primary); margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
    }
    .modal-sec-title img { width: 14px; height: 14px; }

    .other-systems { margin-top: 36px; padding-top: 22px; border-top: 1px solid rgba(255, 255, 255, 0.08); }
    .other-title { font-size: 0.9rem; font-weight: 800; color: var(--text-muted); margin-bottom: 12px; }
    .other-pills { display: flex; flex-wrap: wrap; gap: 8px; }
    .other-pill {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 6px 12px; border-radius: 10px;
      background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1; text-decoration: none; font-size: 0.8rem; font-weight: 700;
    }
    .other-pill:hover { border-color: rgba(245, 196, 81, 0.45); color: #fef08a; }
    .other-pill img { width: 16px; height: 16px; }
  </style>
</head>
<body>
  <div class="minecraft-bg-fixed"><div class="minecraft-bg-overlay"></div></div>

  <header class="ome-header">
    <a href="main.html" class="ome-brand">
      <img class="ome-brand-icon" src="assets/server-icon.png" alt="OME Logo" />
      <div class="ome-brand-text">
        <span class="ome-brand-title">One More Expedition</span>
        <span class="ome-brand-sub">KHTN Server Wiki • 26.3</span>
      </div>
    </a>

    <nav class="ome-nav">
      <a href="main.html" class="ome-nav-btn" style="border-color: rgba(59, 130, 246, 0.45); color: #93c5fd;">
        <img src="assets/icons/grass_block_side.png" alt=""/>
        <span data-i18n="navHome">Trang Chủ</span>
      </a>
      <a href="enchants.html" class="ome-nav-btn" style="color: #f5c451; border-color: rgba(245, 196, 81, 0.45);">
        <img src="assets/icons/enchanted_book.png" alt=""/>
        <span data-i18n="navEnchants">Bách Khoa Phù Phép</span>
      </a>
      <a href="fishing.html" class="ome-nav-btn" style="color: #38bdf8; border-color: rgba(56, 189, 248, 0.45);">
        <img src="assets/icons/fishing_rod.png" alt=""/>
        <span data-i18n="navFishing">Bách Khoa Câu Cá</span>
      </a>
      <a href="world.html" class="ome-nav-btn" style="color: #4ade80; border-color: rgba(74, 222, 128, 0.45);">
        <img src="assets/icons/spyglass.png" alt=""/>
        <span>Biomes &amp; Structures</span>
      </a>
    </nav>

    <div class="ome-header-right">
      <div class="ome-lang-pill">
        <button class="ome-lang-btn" id="btnLangEn" onclick="setLanguage('en')">🇺🇸 EN</button>
        <button class="ome-lang-btn active" id="btnLangVi" onclick="setLanguage('vi')">🇻🇳 VI</button>
      </div>
    </div>
  </header>

  <main class="page-wrap">
    <div class="back-bar">
      <a href="main.html" class="back-btn" id="backHomeBtn">← Quay lại Trang Chủ</a>
    </div>

    <section class="hero-card">
      <div class="hero-icon-box">
        <img class="mc-pixel" src="assets/icons/writable_book.png" alt="Daily Quests" />
      </div>
      <div>
        <h1 class="hero-title" id="heroTitle">Hệ Thống Nhiệm Vụ Ngày (Daily Quests)</h1>
        <p class="hero-sub" id="heroSub">10 Slots / Ngày • 9 Nhánh • Adventure Lv 50 • Co-op</p>
        <p class="hero-desc" id="heroDesc"></p>
      </div>
    </section>

    <!-- Overview 4 cards -->
    <section class="overview-grid" id="overviewGrid"></section>

    <!-- Interactive Quest Catalog -->
    <section class="filter-panel">
      <div class="search-row">
        <div class="search-box">
          <img class="search-ico mc-pixel" src="assets/icons/compass.png" alt=""/>
          <input type="text" id="questSearchInput" placeholder="Tìm nhiệm vụ theo tên, quặng, quái, vật phẩm hoặc khu vực..." autocomplete="off" />
          <button type="button" class="clear-btn" id="questClearBtn">✕</button>
        </div>
        <select id="diffSelect" class="filter-select">
          <option value="all">Độ khó: Tất cả</option>
          <option value="EASY">Easy (5 ô/ngày • 0.5x)</option>
          <option value="MEDIUM">Medium (3 ô/ngày • 1.8x)</option>
          <option value="HARD">Hard (2 ô/ngày • 5.0x)</option>
        </select>
        <select id="dimSelect" class="filter-select">
          <option value="all">Chiều không gian: Tất cả</option>
          <option value="overworld">Overworld (1.0x)</option>
          <option value="nether">The Nether — Lv 15+ (1.2x)</option>
          <option value="end">The End — Lv 30+ (1.4x)</option>
        </select>
      </div>

      <div class="chip-row" id="branchChips">
        <button type="button" class="chip-btn active" data-branch="all" id="brAll">Tất cả (9 nhánh)</button>
        <button type="button" class="chip-btn" data-branch="EXPLORE_BIOME"><img class="mc-pixel" src="assets/icons/grass_block_side.png" alt=""/> <span id="brBio">Khám phá Biome</span></button>
        <button type="button" class="chip-btn" data-branch="EXPLORE_STRUCTURE"><img class="mc-pixel" src="assets/icons/paper.png" alt=""/> <span id="brStr">Khám phá Công trình</span></button>
        <button type="button" class="chip-btn" data-branch="EXPLORE_DUNGEON"><img class="mc-pixel" src="assets/icons/compass.png" alt=""/> <span id="brDun">Khám phá Dungeon</span></button>
        <button type="button" class="chip-btn" data-branch="MINING"><img class="mc-pixel" src="assets/icons/diamond_pickaxe.png" alt=""/> <span id="brMin">Đào Mỏ</span></button>
        <button type="button" class="chip-btn" data-branch="LOGGING"><img class="mc-pixel" src="assets/icons/oak_sapling.png" alt=""/> <span id="brLog">Chặt Gỗ</span></button>
        <button type="button" class="chip-btn" data-branch="GATHER_SUBMIT"><img class="mc-pixel" src="assets/icons/chest_front.png" alt=""/> <span id="brGat">Giao Nộp Vật Phẩm</span></button>
        <button type="button" class="chip-btn" data-branch="FISHING"><img class="mc-pixel" src="assets/icons/fishing_rod.png" alt=""/> <span id="brFis">Câu Cá</span></button>
        <button type="button" class="chip-btn" data-branch="SLAYER"><img class="mc-pixel" src="assets/icons/diamond_sword.png" alt=""/> <span id="brSla">Săn Quái</span></button>
        <button type="button" class="chip-btn" data-branch="ACTION"><img class="mc-pixel" src="assets/icons/ender_pearl.png" alt=""/> <span id="brAct">Hành Động &amp; Di Chuyển</span></button>
      </div>
    </section>

    <div class="results-bar">
      <span id="questResultsCount"></span>
      <span id="questClickHint"></span>
    </div>
    <div class="quests-grid" id="questsGrid"></div>

    <section class="other-systems">
      <div class="other-title" id="otherTitle">Khám Phá Hệ Thống Khác</div>
      <div class="other-pills" id="otherPills"></div>
    </section>
  </main>

  <div class="modal-overlay" id="questModal">
    <div class="modal-box">
      <button type="button" class="modal-close" onclick="closeQuestModal()">✕</button>
      <div class="modal-header">
        <div class="modal-icon-big"><img class="mc-pixel" id="qModalIcon" src="assets/icons/writable_book.png" alt=""/></div>
        <div>
          <h2 id="qModalTitle" style="font-size:1.25rem;font-weight:800;line-height:1.25;">Quest</h2>
          <div class="badge-row" id="qModalBadges" style="margin-top:8px;"></div>
        </div>
      </div>
      <div id="qModalBody"></div>
    </div>
  </div>

  <script>
    const LANG_KEY = "ome_wiki_lang";
    let currentLang = localStorage.getItem(LANG_KEY) || "vi";
    let currentBranch = "all";

    const ALL_SYSTEMS = [
      { id: "skyblock", icon: "assets/icons/oak_sapling.png", name: { vi: "Skyblock", en: "Skyblock" }, href: "skyblock.html" },
      { id: "world", icon: "assets/icons/spyglass.png", name: { vi: "Biomes & Structures", en: "Biomes & Structures" }, href: "world.html" },
      { id: "adventure", icon: "assets/icons/compass.png", name: { vi: "Adventure", en: "Adventure" }, href: "adventure.html" },
      { id: "enchants", icon: "assets/icons/enchanted_book.png", name: { vi: "Enchantments", en: "Enchantments" }, href: "enchants.html" },
      { id: "fishing", icon: "assets/icons/fishing_rod.png", name: { vi: "Fishing", en: "Fishing" }, href: "fishing.html" },
      { id: "minetreasure", icon: "assets/icons/netherite_pickaxe.png", name: { vi: "Mine Treasure", en: "Mine Treasure" }, href: "minetreasure.html" },
      { id: "bosses", icon: "assets/icons/dragonblade.png", name: { vi: "Items • Bosses", en: "Items • Bosses" }, href: "bosses.html" },
      { id: "warping", icon: "assets/icons/ender_pearl.png", name: { vi: "Teleports", en: "Teleports" }, href: "warping.html" },
      { id: "economy", icon: "assets/icons/emerald.png", name: { vi: "Economy", en: "Economy" }, href: "economy.html" },

        targets: [
          { icon: "assets/icons/mc/furnace.png", vi: "Smelt / Cook", en: "Smelt / Cook", qty: "32–48" },
          { icon: "assets/icons/mc/enchanting_table.png", vi: "Enchant", en: "Enchant", qty: "4–6" },

          { icon: "assets/icons/mc/anvil.png", vi: "Anvil", en: "Anvil", qty: "3–6" },

    function esc(s) {
      return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function setLanguage(lang) {
      currentLang = lang === "en" ? "en" : "vi";
      localStorage.setItem(LANG_KEY, currentLang);
      applyLang();
    }

    window.addEventListener("storage", e => {
      if (e.key === LANG_KEY && e.newValue && e.newValue !== currentLang) {
        currentLang = e.newValue === "en" ? "en" : "vi";
        applyLang();
      }
    });

    function applyLang() {
      const vi = currentLang === "vi";
      document.documentElement.lang = currentLang;
      document.getElementById("btnLangEn").classList.toggle("active", !vi);
      document.getElementById("btnLangVi").classList.toggle("active", vi);

      document.getElementById("backHomeBtn").textContent = vi ? "← Quay lại Trang Chủ" : "← Back to Main Page";
      document.getElementById("heroTitle").textContent = vi ? "Hệ Thống Nhiệm Vụ Ngày (Daily Quests)" : "Daily Quests Encyclopedia";
      document.getElementById("heroSub").textContent = vi ? "10 Ô / Ngày • 9 Nhánh • Adventure Lv 50 • Co-op" : "10 Slots / Day • 9 Branches • Adventure Lv 50 • Co-op";
      document.getElementById("heroDesc").textContent = vi
        ? "Hoàn thành tối đa 10 nhiệm vụ mỗi ngày để tăng cấp Adventure, kiếm Coins theo hệ số chuỗi Daily và nhận thưởng Full 10/10 lên tới 12.0x."
        : "Complete up to 10 daily quests to level up Adventure Rank, scale Coin payouts with your Daily multiplier, and unlock a 12.0x Full-10 completion bonus.";

      document.getElementById("questSearchInput").placeholder = vi
        ? "Tìm nhiệm vụ theo tên, quặng, quái, vật phẩm hoặc khu vực..."
        : "Search quests by name, ore, mob, item, or biome...";
      document.getElementById("questClickHint").textContent = vi ? "Nhấp vào thẻ nhiệm vụ để xem chi tiết" : "Click any quest card for full details";
      document.getElementById("otherTitle").textContent = vi ? "Khám Phá Hệ Thống Khác" : "Browse Other Systems";

      const dSel = document.getElementById("diffSelect");
      dSel.options[0].text = vi ? "Độ khó: Tất cả" : "Difficulty: All";
      dSel.options[1].text = vi ? "Easy (5 ô/ngày • 0.5x)" : "Easy (5 slots/day • 0.5x)";
      dSel.options[2].text = vi ? "Medium (3 ô/ngày • 1.8x)" : "Medium (3 slots/day • 1.8x)";
      dSel.options[3].text = vi ? "Hard (2 ô/ngày • 5.0x)" : "Hard (2 slots/day • 5.0x)";

      const dimSel = document.getElementById("dimSelect");
      dimSel.options[0].text = vi ? "Chiều không gian: Tất cả" : "Dimension: All";
      dimSel.options[1].text = "Overworld (1.0x)";
      dimSel.options[2].text = vi ? "The Nether — Lv 15+ (1.2x)" : "The Nether — Lv 15+ (1.2x)";
      dimSel.options[3].text = vi ? "The End — Lv 30+ (1.4x)" : "The End — Lv 30+ (1.4x)";

      document.getElementById("brAll").textContent = vi ? "Tất cả (9 nhánh)" : "All (9 Branches)";
      document.getElementById("brBio").textContent = vi ? "Khám phá Biome" : "Explore Biome";
      document.getElementById("brStr").textContent = vi ? "Khám phá Công trình" : "Explore Structure";
      document.getElementById("brDun").textContent = vi ? "Khám phá Dungeon" : "Explore Dungeon";
      document.getElementById("brMin").textContent = vi ? "Đào Mỏ" : "Mining";
      document.getElementById("brLog").textContent = vi ? "Chặt Gỗ" : "Logging";
      document.getElementById("brGat").textContent = vi ? "Giao Nộp Vật Phẩm" : "Gather & Submit";
      document.getElementById("brFis").textContent = vi ? "Câu Cá" : "Fishing";
      document.getElementById("brSla").textContent = vi ? "Săn Quái" : "Slayer";
      document.getElementById("brAct").textContent = vi ? "Hành Động & Di Chuyển" : "Action & Travel";

      renderOverview();
      renderOtherPills();
      renderQuests();
    }

    function renderOverview() {
      const vi = currentLang === "vi";
      const cards = [
        {
          icon: "assets/icons/writable_book.png",
          title: vi ? "Cấu Trúc 10 Nhiệm Vụ / Ngày" : "10 Daily Slots & Drafts",
          items: vi ? [
            "Mỗi ngày có <strong>5 Easy</strong> (<code>0.50x</code> • <code>50 XP</code>), <strong>3 Medium</strong> (<code>1.80x</code> • <code>130 XP</code>), <strong>2 Hard</strong> (<code>5.00x</code> • <code>320 XP</code>).",
            "Mỗi ô cho chọn <strong>4</strong> nhiệm vụ ngẫu nhiên + <strong>1</strong> lượt đổi miễn phí (Reroll)/ngày.",
            "Hoàn thành cả <strong>10/10</strong> nhận thưởng lớn: <code>12.00x</code> Daily Coins + <code>+500 XP</code>!"
          ] : [
            "Daily board: <strong>5 Easy</strong> (<code>0.50x</code> • <code>50 XP</code>), <strong>3 Medium</strong> (<code>1.80x</code> • <code>130 XP</code>), <strong>2 Hard</strong> (<code>5.00x</code> • <code>320 XP</code>).",
            "Each slot offers <strong>4</strong> draft choices + <strong>1</strong> base free reroll per day.",
            "Completing all <strong>10/10</strong> grants a massive <code>12.00x</code> Daily Coin bonus + <code>+500 XP</code>!"
          ]
        },
        {
          icon: "assets/icons/nether_star.png",
          title: vi ? "Cấp Adventure & Mở Khóa" : "Adventure Level & Unlocks",
          items: vi ? [
            "Cấp tối đa: <strong>Adventure Lv 50</strong> — tăng <code>+2.5%</code> Quest Coins mỗi cấp (tối đa +125%).",
            "<strong>Lv 15:</strong> Mở khóa nhiệm vụ <strong>The Nether</strong> (thưởng <code>1.20x</code>).",
            "<strong>Lv 30:</strong> Mở khóa nhiệm vụ <strong>The End</strong> (thưởng <code>1.40x</code>) và nhiệm vụ <strong>Bay Elytra</strong>."
          ] : [
            "Max Level: <strong>Adventure Lv 50</strong> — grants <code>+2.5%</code> Quest Coins per level (up to +125%).",
            "<strong>Lv 15:</strong> Unlocks <strong>The Nether</strong> quests (<code>1.20x</code> reward multiplier).",
            "<strong>Lv 30:</strong> Unlocks <strong>The End</strong> quests (<code>1.40x</code> reward multiplier) & <strong>Elytra</strong> quests."
          ]
        },
        {
          icon: "assets/icons/enchanted_book.png",
          title: vi ? "4 Phù Phép Bổ Trợ Quest" : "4 Quest Enchantments",
          items: vi ? [
            "<strong>Adventurer:</strong> <code>+5%</code> Adventure XP mỗi cấp.",
            "<strong>Bounty Hunter:</strong> <code>+4%</code> Quest Coins mỗi cấp.",
            "<strong>Pathfinder:</strong> <code>+8%</code> tốc độ & <code>+16</code> block bán kính nhận mục tiêu mỗi cấp.",
            "<strong>Contract Master:</strong> <code>+1</code> lựa chọn nhận quest & <code>+1</code> lượt Reroll miễn phí."
          ] : [
            "<strong>Adventurer:</strong> <code>+5%</code> Adventure XP per level.",
            "<strong>Bounty Hunter:</strong> <code>+4%</code> Quest Coins per level.",
            "<strong>Pathfinder:</strong> <code>+8%</code> movement speed & <code>+16</code> blocks capture radius per level.",
            "<strong>Contract Master:</strong> <code>+1</code> extra draft choice & <code>+1</code> free daily reroll."
          ]
        },
        {
          icon: "assets/icons/paper.png",
          title: vi ? "Lệnh & Chơi Co-op" : "Commands & Co-op Sharing",
          items: vi ? [
            "<code>/quest</code> hoặc <code>/q</code> — Mở bảng nhận & nộp nhiệm vụ.",
            "<code>/quest share &lt;ô&gt;</code> &amp; <code>/quest accept &lt;mã&gt;</code> — Chia sẻ làm chung Co-op với bạn bè.",
            "<code>/quest track &lt;ô|auto&gt;</code> — Ghim tiến độ lên Sidebar.",
            "<code>/quest stats</code> &amp; <code>/quest submit &lt;ô&gt;</code> — Xem cấp Adventure &amp; nộp đồ."
          ] : [
            "<code>/quest</code> or <code>/q</code> — Open the Quest Draft Board.",
            "<code>/quest share &lt;slot&gt;</code> &amp; <code>/quest accept &lt;code&gt;</code> — Share quests for Co-op progress.",
            "<code>/quest track &lt;slot|auto&gt;</code> — Pin quest progress to the Sidebar.",
            "<code>/quest stats</code> &amp; <code>/quest submit &lt;slot&gt;</code> — Check Adventure stats &amp; deliver items."
          ]
        }
      ];
      document.getElementById("overviewGrid").innerHTML = cards.map(c => `
        <div class="info-card">
          <div class="info-head"><img class="mc-pixel" src="${c.icon}" alt=""/><span>${c.title}</span></div>
          <ul class="info-list">${c.items.map(i => `<li>${i}</li>`).join("")}</ul>
        </div>
      `).join("");
    }

    function renderOtherPills() {
      document.getElementById("otherPills").innerHTML = ALL_SYSTEMS.map(s => `
        <a href="${s.href}" class="other-pill">
          <img class="mc-pixel" src="${s.icon}" alt=""/>
          <span>${esc(s.name[currentLang] || s.name.en)}</span>
        </a>
      `).join("");
    }

    function dimLabel(dim, vi) {
      if (dim === "nether") return vi ? "The Nether (Lv 15+)" : "The Nether (Lv 15+)";
      if (dim === "end") return vi ? "The End (Lv 30+)" : "The End (Lv 30+)";
      if (dim === "all") return vi ? "Mọi chiều (theo Lv)" : "All Dimensions (Lv scaled)";
      return "Overworld";
    }

    function renderQuests() {
      const vi = currentLang === "vi";
      const q = document.getElementById("questSearchInput").value.trim().toLowerCase();
      document.getElementById("questClearBtn").style.display = q ? "block" : "none";
      const diff = document.getElementById("diffSelect").value;
      const dim = document.getElementById("dimSelect").value;

      const list = QUESTS_DATA.filter(it => {
        if (currentBranch !== "all" && it.branch !== currentBranch) return false;
        if (diff !== "all" && it.diff !== diff) return false;
        if (dim !== "all" && it.dim !== dim && it.dim !== "all") return false;
        if (q) {
          const hay = [it.branch, it.name_en, it.name_vi, it.target_en, it.target_vi, it.desc_en, it.desc_vi].join(" ").toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      document.getElementById("questResultsCount").textContent = vi
        ? `Đang hiển thị ${list.length} / ${QUESTS_DATA.length} nhóm nhiệm vụ`
        : `Showing ${list.length} of ${QUESTS_DATA.length} quest pools`;

      function renderTargetList(it, vi) {
        const rows = it.targets || [];
        if (!rows.length) return `<div class="q-desc">${esc(vi ? it.target_vi : it.target_en)}</div>`;
        return `<div class="q-target-list">${rows.map(r => `
          <div class="q-target-row">
            <div class="q-target-left">
              <img class="mc-pixel" src="${esc(r.icon)}" loading="lazy" alt=""/>
              <span class="q-target-name">${esc(vi ? r.vi : r.en)}</span>
            </div>
            <span class="q-qty-pill ${r.boss ? 'boss' : ''}">${esc(r.qty)}</span>
          </div>
        `).join("")}</div>`;
      }

      document.getElementById("questsGrid").innerHTML = list.map(it => `
        <div class="quest-card" onclick="openQuestModal('${it.id}')">
          <div class="card-top">
            <div class="q-icon-wrap"><img class="mc-pixel" src="${it.icon}" alt=""/></div>
            <div style="min-width:0;">
              <div class="q-title">${esc(vi ? it.name_vi : it.name_en)}</div>
              <div class="q-sub">${esc(it.branch)}</div>
            </div>
          </div>
          <div class="badge-row">
            <span class="badge diff-${it.diff}">${it.diff}</span>
            <span class="badge dim-pill">${esc(dimLabel(it.dim, vi))}</span>
          </div>
          ${renderTargetList(it, vi)}
          <div class="q-foot">
            <span class="badge reward-pill">${esc(it.reward)}</span>
          </div>
        </div>
      `).join("");
    }

    function openQuestModal(id) {
      const it = QUESTS_DATA.find(x => x.id === id);
      if (!it) return;
      const vi = currentLang === "vi";
      document.getElementById("qModalIcon").src = it.icon;
      document.getElementById("qModalTitle").textContent = vi ? it.name_vi : it.name_en;
      document.getElementById("qModalBadges").innerHTML = `
        <span class="badge diff-${it.diff}">${it.diff}</span>
        <span class="badge dim-pill">${esc(dimLabel(it.dim, vi))}</span>
        <span class="badge">${esc(it.branch)}</span>
      `;
      const targetHtml = (it.targets && it.targets.length)
        ? `<div class="q-target-list">${it.targets.map(r => `
            <div class="q-target-row">
              <div class="q-target-left">
                <img class="mc-pixel" src="${esc(r.icon)}" style="width:24px;height:24px;" alt=""/>
                <span class="q-target-name" style="font-size:0.86rem;">${esc(vi ? r.vi : r.en)}</span>
              </div>
              <span class="q-qty-pill ${r.boss ? 'boss' : ''}">${esc(r.qty)}</span>
            </div>
          `).join("")}</div>`
        : `<div style="font-size:0.9rem;color:#f8fafc;">${esc(vi ? it.target_vi : it.target_en)}</div>`;
      document.getElementById("qModalBody").innerHTML = `
        <div class="modal-section">
          <div class="modal-sec-title"><img class="mc-pixel" src="assets/icons/compass.png" alt=""/> ${vi ? "Mục Tiêu & Số Lượng" : "Targets & Quantities"}</div>
          ${targetHtml}
        </div>
        <div class="modal-section">
          <div class="modal-sec-title"><img class="mc-pixel" src="assets/icons/writable_book.png" alt=""/> ${vi ? "Cơ Chế & Điều Kiện" : "Mechanics & Requirements"}</div>
          <div style="font-size:0.88rem;color:#cbd5e1;">${esc(vi ? it.desc_vi : it.desc_en)}</div>
        </div>
        <div class="modal-section">
          <div class="modal-sec-title"><img class="mc-pixel" src="assets/icons/emerald.png" alt=""/> ${vi ? "Phần Thưởng Cơ Bản" : "Base Reward Scaling"}</div>
          <div style="font-size:0.9rem;color:#fde68a;font-weight:700;">${esc(it.reward)}</div>
        </div>
      `;
      document.getElementById("questModal").classList.add("active");
    }

    function closeQuestModal() {
      document.getElementById("questModal").classList.remove("active");
    }

    document.getElementById("questSearchInput").addEventListener("input", renderQuests);
    document.getElementById("questClearBtn").addEventListener("click", () => {
      document.getElementById("questSearchInput").value = "";
      renderQuests();
    });
    document.getElementById("diffSelect").addEventListener("change", renderQuests);
    document.getElementById("dimSelect").addEventListener("change", renderQuests);
    document.querySelectorAll("#branchChips .chip-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#branchChips .chip-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentBranch = btn.dataset.branch;
        renderQuests();
      });
    });
    document.getElementById("questModal").addEventListener("click", e => {
      if (e.target.id === "questModal") closeQuestModal();
    });
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") closeQuestModal();
    });

    applyLang();
  </script>
</body>
</html>
