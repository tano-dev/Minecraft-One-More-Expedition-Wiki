  <title>Biomes &amp; Structures — One More Expedition Wiki</title>
  <link rel="icon" type="image/png" href="assets/server-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/wiki-header.css" />
  <script src="assets/wiki-lang-sync.js"></script>
  <style>
    :root {
      --bg-dark: #0d131f;
      --card-bg: rgba(18, 24, 38, 0.9);
      --border-card: rgba(255, 255, 255, 0.1);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --gold-primary: #f5c451;
      --aqua: #38bdf8;
      --green: #4ade80;
      --epic: #e879f9;
      --red: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main); min-height: 100vh; line-height: 1.55;
      background-color: var(--bg-dark); position: relative; -webkit-font-smoothing: antialiased;
    }
    .minecraft-bg-fixed {
      position: fixed; inset: 0; z-index: -10; pointer-events: none;
      background: #101726 url('assets/bg.jpg') no-repeat center center / cover;
    }
    .minecraft-bg-overlay {
      position: absolute; inset: 0;
      background: radial-gradient(circle at 50% 25%, rgba(15, 23, 42, 0.48) 0%, rgba(7, 10, 18, 0.88) 100%);
    }
    .mc-pixel { image-rendering: pixelated; image-rendering: crisp-edges; }
    .page-wrap { max-width: 1260px; margin: 0 auto; padding: 24px 20px 64px; }
    .back-bar { margin-bottom: 18px; }
    .back-btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 10px;
      background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1; text-decoration: none; font-size: 0.85rem; font-weight: 700; transition: all 0.2s;
    }
    .back-btn:hover { background: rgba(245, 196, 81, 0.14); border-color: rgba(245, 196, 81, 0.45); color: var(--gold-primary); }

    .hero-card {
      background: linear-gradient(135deg, rgba(24, 34, 54, 0.94), rgba(15, 23, 38, 0.96));
      border: 1px solid rgba(245, 196, 81, 0.28); border-radius: 18px; padding: 24px 28px;
      display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.45); margin-bottom: 20px;
    }
    .hero-icon-box {
      width: 68px; height: 68px; border-radius: 16px;
      background: rgba(245, 196, 81, 0.12); border: 1px solid rgba(245, 196, 81, 0.35);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .hero-icon-box img { width: 44px; height: 44px; }
    .hero-title { font-size: 1.7rem; font-weight: 800; color: #fef08a; line-height: 1.2; }
    .hero-sub { color: #93c5fd; font-size: 0.92rem; font-weight: 700; margin-top: 4px; }
    .hero-desc { color: var(--text-muted); font-size: 0.85rem; margin-top: 6px; max-width: 820px; }

    /* 2 Mode Buttons */
    .mode-switch-bar {
      display: grid; grid-template-columns: repeat(2, minmax(220px, 1fr));
      gap: 14px; margin-bottom: 18px;
    }
    .mode-btn {
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      padding: 16px 20px; border-radius: 14px;
      background: rgba(18, 25, 40, 0.88); border: 1.5px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1; cursor: pointer; transition: all 0.2s ease; text-align: left; font-family: inherit;
    }
    .mode-btn:hover { border-color: rgba(245, 196, 81, 0.45); background: rgba(28, 38, 60, 0.92); transform: translateY(-2px); }
    .mode-btn.active {
      background: linear-gradient(135deg, rgba(245, 196, 81, 0.18), rgba(74, 222, 128, 0.1));
      border-color: var(--gold-primary); color: #fef08a;
    }
    .mode-btn-left { display: flex; align-items: center; gap: 14px; }
    .mode-btn-icon {
      width: 42px; height: 42px; border-radius: 10px;
      background: rgba(0, 0, 0, 0.35); border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .mode-btn-icon img { width: 26px; height: 26px; }
    .mode-btn-title { font-size: 1.08rem; font-weight: 800; }
    .mode-btn-sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }
    .mode-count-pill {
      padding: 5px 12px; border-radius: 999px;
      background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.14);
      font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; font-weight: 700; color: #f8fafc;
    }
    .mode-btn.active .mode-count-pill { background: rgba(245, 196, 81, 0.22); border-color: rgba(245, 196, 81, 0.55); color: #fde68a; }

    /* Filters */
    .filter-panel {
      background: var(--card-bg); border: 1px solid var(--border-card);
      border-radius: 16px; padding: 18px 20px; margin-bottom: 16px;
    }
    .search-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    .search-box { flex: 1 1 280px; position: relative; display: flex; align-items: center; }
    .search-box .search-ico { position: absolute; left: 13px; width: 16px; height: 16px; pointer-events: none; }
    .search-box input {
      width: 100%; padding: 10px 36px 10px 38px; border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.14); background: rgba(10, 15, 25, 0.85);
      color: var(--text-main); font-size: 0.9rem; font-family: inherit; outline: none;
    }
    .search-box input:focus { border-color: var(--gold-primary); }
    .clear-btn {
      position: absolute; right: 10px; background: none; border: none;
      color: var(--text-muted); cursor: pointer; font-size: 0.9rem; display: none;
    }
    .filter-select {
      padding: 9px 12px; border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.14); background: rgba(10, 15, 25, 0.88);
      color: var(--text-main); font-size: 0.85rem; font-family: inherit; cursor: pointer;
    }
    .chip-row { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
    .chip-btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12); background: rgba(255, 255, 255, 0.04);
      color: #cbd5e1; font-size: 0.77rem; font-weight: 700; cursor: pointer; font-family: inherit;
      transition: all 0.15s;
    }
    .chip-btn:hover { border-color: rgba(245, 196, 81, 0.45); color: #fef08a; }
    .chip-btn.active { background: rgba(245, 196, 81, 0.2); border-color: var(--gold-primary); color: #fde68a; }

    .results-bar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px; font-size: 0.85rem; color: var(--text-muted); flex-wrap: wrap; gap: 8px;
    }

    .world-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(265px, 1fr)); gap: 12px;
    }
    .w-card {
      background: var(--card-bg); border: 1px solid var(--border-card); border-radius: 12px;
      padding: 14px; cursor: pointer; transition: all 0.18s ease;
      display: flex; flex-direction: column; gap: 8px;
    }
    .w-card:hover { border-color: rgba(245, 196, 81, 0.55); transform: translateY(-2px); background: rgba(24, 33, 52, 0.95); }
    .w-name { font-size: 0.95rem; font-weight: 800; line-height: 1.25; color: #f8fafc; }
    .w-id { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: var(--text-muted); word-break: break-all; }
    .badge-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: auto; }
    .badge {
      display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 6px;
      font-size: 0.71rem; font-weight: 700; border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.06); color: #e2e8f0;
    }
    .dim-overworld { color: #4ade80; border-color: rgba(74, 222, 128, 0.4); background: rgba(74, 222, 128, 0.12); }
    .dim-nether { color: #f87171; border-color: rgba(248, 113, 113, 0.42); background: rgba(248, 113, 113, 0.14); }
    .dim-end { color: #e879f9; border-color: rgba(232, 121, 249, 0.42); background: rgba(232, 121, 249, 0.14); }
    .where-pill { color: #fde68a; border-color: rgba(245, 196, 81, 0.35); background: rgba(245, 196, 81, 0.1); }
    .layer-pill { color: #7dd3fc; border-color: rgba(56, 189, 248, 0.35); background: rgba(56, 189, 248, 0.1); }

    .viewer-3d-wrap {
      margin-top: 12px;
      border-radius: 14px;
      border: 1px solid rgba(56, 189, 248, 0.35);
      background: radial-gradient(circle at 50% 35%, #162136 0%, #090e18 100%);
      overflow: hidden;
    }
    .viewer-canvas-box {
      width: 100%;
      height: 340px;
      position: relative;
      cursor: grab;
    }
    .viewer-canvas-box:active { cursor: grabbing; }
    .viewer-status {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #93c5fd;
      font-size: 0.85rem;
      font-weight: 700;
      pointer-events: none;
    }
    .viewer-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding: 10px 14px;
      background: rgba(10, 15, 25, 0.88);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.78rem;
    }
    .viewer-btn {
      padding: 4px 10px;
      border-radius: 7px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.06);
      color: #e2e8f0;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }
    .viewer-btn.on { border-color: var(--aqua); color: #7dd3fc; background: rgba(56, 189, 248, 0.16); }

    /* Pagination */
    .pager {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      margin-top: 22px; flex-wrap: wrap;
    }
    .pager-btn {
      padding: 8px 16px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06); color: #f8fafc; font-weight: 700;
      font-size: 0.84rem; cursor: pointer; font-family: inherit;
    }
    .pager-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .pager-btn:not(:disabled):hover { border-color: var(--gold-primary); color: var(--gold-primary); }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(5, 8, 15, 0.82); backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center; z-index: 2000; padding: 18px;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      width: 100%; max-width: 720px; max-height: 92vh; overflow-y: auto; background: #121928; border: 1px solid rgba(245, 196, 81, 0.38);
      border-radius: 18px; padding: 24px; position: relative; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
    }
    .modal-close {
      position: absolute; top: 16px; right: 16px; width: 32px; height: 32px;
      border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06); color: #e2e8f0; cursor: pointer; font-size: 1rem;
    }
    .modal-sec {
      background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px; padding: 12px 14px; margin-top: 12px; font-size: 0.86rem; color: #cbd5e1;
    }
    .modal-sec code {
      font-family: 'JetBrains Mono', monospace; background: rgba(0, 0, 0, 0.45);
      padding: 4px 8px; border-radius: 6px; color: #fde68a; display: block; margin-top: 6px; word-break: break-all;
    }

    .other-systems { margin-top: 36px; padding-top: 22px; border-top: 1px solid rgba(255, 255, 255, 0.08); }
    .other-title { font-size: 0.9rem; font-weight: 800; color: var(--text-muted); margin-bottom: 12px; }
    .other-pills { display: flex; flex-wrap: wrap; gap: 8px; }
    .other-pill {
      display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 10px;
      background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1; text-decoration: none; font-size: 0.8rem; font-weight: 700;
    }
    .other-pill:hover { border-color: rgba(245, 196, 81, 0.45); color: #fef08a; }
    .other-pill img { width: 16px; height: 16px; }

    @media (max-width: 680px) { .mode-switch-bar { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="minecraft-bg-fixed"><div class="minecraft-bg-overlay"></div></div>

  <header class="ome-header">
    <a href="main.html" class="ome-brand">
      <img class="ome-brand-icon" src="assets/server-icon.png" alt="OME Logo" />
      <div class="ome-brand-text">
        <span class="ome-brand-title">One More Expedition</span>
        <span class="ome-brand-sub">KHTN Server Wiki • 26.3</span>
      </div>
    </a>

    <nav class="ome-nav">
      <a href="main.html" class="ome-nav-btn" style="border-color: rgba(59, 130, 246, 0.45); color: #93c5fd;">
        <img src="assets/icons/grass_block_side.png" alt=""/>
        <span data-i18n="navHome">Trang Chủ</span>
      </a>
      <a href="enchants.html" class="ome-nav-btn" style="color: #f5c451; border-color: rgba(245, 196, 81, 0.45);">
        <img src="assets/icons/enchanted_book.png" alt=""/>
        <span data-i18n="navEnchants">Bách Khoa Phù Phép</span>
      </a>
      <a href="fishing.html" class="ome-nav-btn" style="color: #38bdf8; border-color: rgba(56, 189, 248, 0.45);">
        <img src="assets/icons/fishing_rod.png" alt=""/>
        <span data-i18n="navFishing">Bách Khoa Câu Cá</span>
      </a>
      <a href="world.html" class="ome-nav-btn active" style="color: #4ade80; border-color: rgba(74, 222, 128, 0.7);">
        <img src="assets/icons/spyglass.png" alt=""/>
        <span>Biomes &amp; Structures</span>
      </a>
    </nav>

    <div class="ome-header-right">
      <div class="ome-lang-pill">
        <button class="ome-lang-btn" id="btnLangEn" onclick="setLanguage('en')">🇺🇸 EN</button>
        <button class="ome-lang-btn active" id="btnLangVi" onclick="setLanguage('vi')">🇻🇳 VI</button>
      </div>
    </div>
  </header>

  <main class="page-wrap">
    <div class="back-bar">
      <a href="main.html" class="back-btn" id="backHomeBtn">← Quay lại Trang Chủ</a>
    </div>

    <section class="hero-card">
      <div class="hero-icon-box">
        <img class="mc-pixel" src="assets/icons/spyglass.png" alt="Biomes & Structures" />
      </div>
      <div>
        <h1 class="hero-title" id="heroTitle">Biomes &amp; Structures</h1>
        <p class="hero-sub" id="heroSub">Terralith • Incendium • Nullscape • Stellarity • 40+ Structure Packs</p>
        <p class="hero-desc" id="heroDesc"></p>
      </div>
    </section>

    <div class="mode-switch-bar">
      <button type="button" class="mode-btn active" id="modeBiomesBtn" onclick="switchMode('biomes')">
        <div class="mode-btn-left">
          <div class="mode-btn-icon"><img class="mc-pixel" src="assets/icons/grass_block_side.png" alt=""/></div>
          <div>
            <div class="mode-btn-title" id="modeBiomesTitle">Quần Xã Sinh Vật (Biomes)</div>
            <div class="mode-btn-sub" id="modeBiomesSub">Terralith, Incendium, Nullscape, Stellarity &amp; Vanilla</div>
          </div>
        </div>
        <span class="mode-count-pill" id="biomesCountPill">0</span>
      </button>

      <button type="button" class="mode-btn" id="modeStructsBtn" onclick="switchMode('structures')">
        <div class="mode-btn-left">
          <div class="mode-btn-icon"><img class="mc-pixel" src="assets/icons/spyglass.png" alt=""/></div>
          <div>
            <div class="mode-btn-title" id="modeStructsTitle">Công Trình &amp; Dungeon (Structures)</div>
            <div class="mode-btn-sub" id="modeStructsSub">Moog's, DnT, Trek, CTOV, Wabi-Sabi, Katters, ATi &amp; More</div>
          </div>
        </div>
        <span class="mode-count-pill" id="structsCountPill">0</span>
      </button>
    </div>

    <section class="filter-panel">
      <div class="search-row">
        <div class="search-box">
          <img class="search-ico mc-pixel" src="assets/icons/compass.png" alt=""/>
          <input type="text" id="worldSearchInput" placeholder="Tìm theo tên hoặc ID (vd: terralith, cherry, fortress, castle)..." autocomplete="off" />
          <button type="button" class="clear-btn" id="worldClearBtn">✕</button>
        </div>
        <select id="dimFilter" class="filter-select">
          <option value="all">Chiều không gian: Tất cả</option>
          <option value="overworld">Overworld</option>
          <option value="nether">The Nether</option>
          <option value="end">The End</option>
        </select>
        <select id="packFilter" class="filter-select"></select>
      </div>
      <div class="chip-row" id="packChips"></div>
    </section>

    <div class="results-bar">
      <span id="resultsCount"></span>
      <span id="clickHint"></span>
    </div>
    <div class="world-grid" id="worldGrid"></div>

    <div class="pager">
      <button type="button" class="pager-btn" id="prevBtn" onclick="changePage(-1)">← Trước</button>
      <span id="pageInfo" style="font-size:0.85rem;color:#cbd5e1;font-weight:700;"></span>
      <button type="button" class="pager-btn" id="nextBtn" onclick="changePage(1)">Sau →</button>
    </div>

    <section class="other-systems">
      <div class="other-title" id="otherTitle">Khám Phá Hệ Thống Khác</div>
      <div class="other-pills" id="otherPills"></div>
    </section>
  </main>

  <div class="modal-overlay" id="worldModal">
    <div class="modal-box">
      <button type="button" class="modal-close" onclick="closeWorldModal()">✕</button>
      <h2 id="wModalTitle" style="font-size:1.25rem;font-weight:800;color:#fef08a;padding-right:34px;">Title</h2>
      <div id="wModalId" style="font-family:'JetBrains Mono',monospace;font-size:0.78rem;color:#94a3b8;margin-top:4px;word-break:break-all;"></div>
      <div class="badge-row" id="wModalBadges" style="margin-top:10px;"></div>
      <div id="wModalBody"></div>
    </div>
  </div>

  <script src="assets/js/world_data.js"></script>
  <script>
    const LANG_KEY = "ome_wiki_lang";
    let currentLang = localStorage.getItem(LANG_KEY) || "vi";
    let currentMode = "biomes";
    let currentPage = 1;
    const PAGE_SIZE = 60;

    const ALL_SYSTEMS = [
      { id: "skyblock", icon: "assets/icons/oak_sapling.png", name: { vi: "Skyblock", en: "Skyblock" }, href: "skyblock.html" },
      { id: "adventure", icon: "assets/icons/compass.png", name: { vi: "Adventure", en: "Adventure" }, href: "adventure.html" },
      { id: "enchants", icon: "assets/icons/enchanted_book.png", name: { vi: "Enchantments", en: "Enchantments" }, href: "enchants.html" },
      { id: "fishing", icon: "assets/icons/fishing_rod.png", name: { vi: "Fishing", en: "Fishing" }, href: "fishing.html" },
      { id: "minetreasure", icon: "assets/icons/netherite_pickaxe.png", name: { vi: "Mine Treasure", en: "Mine Treasure" }, href: "minetreasure.html" },
      { id: "bosses", icon: "assets/icons/dragonblade.png", name: { vi: "Items • Bosses", en: "Items • Bosses" }, href: "bosses.html" },
      { id: "warping", icon: "assets/icons/ender_pearl.png", name: { vi: "Teleports", en: "Teleports" }, href: "warping.html" },
      { id: "quests", icon: "assets/icons/writable_book.png", name: { vi: "Daily Quests", en: "Daily Quests" }, href: "quests.html" },
      { id: "economy", icon: "assets/icons/emerald.png", name: { vi: "Economy", en: "Economy" }, href: "economy.html" },
      { id: "prefix", icon: "assets/icons/name_tag.png", name: { vi: "Rank / Prefix", en: "Rank / Prefix" }, href: "prefix.html" },
      { id: "redeem", icon: "assets/icons/paper.png", name: { vi: "Codes", en: "Codes" }, href: "redeem.html" },
      { id: "utility", icon: "assets/icons/amethyst_shard.png", name: { vi: "Utility & QoL", en: "Utility & QoL" }, href: "utility.html" },

      return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function setLanguage(lang) {
      currentLang = lang === "en" ? "en" : "vi";
      localStorage.setItem(LANG_KEY, currentLang);
      applyLang();
    }

    window.addEventListener("storage", e => {
      if (e.key === LANG_KEY && e.newValue && e.newValue !== currentLang) {

        applyLang();
      }

      currentPage = 1;
      document.getElementById("modeBiomesBtn").classList.toggle("active", currentMode === "biomes");
      document.getElementById("modeStructsBtn").classList.toggle("active", currentMode === "structures");
      populatePackFilters();
      renderWorld();

    function populatePackFilters() {
      const vi = currentLang === "vi";
      const source = currentMode === "biomes" ? BIOMES_DATA : STRUCTURES_DATA;
      const counts = {};
      source.forEach(x => { counts[x.pack] = (counts[x.pack] || 0) + 1; });
      const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);

      const sel = document.getElementById("packFilter");
      const prev = sel.value;
      sel.innerHTML = `<option value="all">${vi ? "Nguồn: Tất cả" : "Pack: All"} (${source.length})</option>` +
        sorted.map(([p, c]) => `<option value="${esc(p)}">${esc(p)} (${c})</option>`).join("");
      if ([...sel.options].some(o => o.value === prev)) sel.value = prev;

      const chips = document.getElementById("packChips");
      const activePack = sel.value || "all";
      chips.innerHTML = `<button type="button" class="chip-btn ${activePack === 'all' ? 'active' : ''}" onclick="selectPack('all')">${vi ? "Tất cả" : "All"} (${source.length})</button>` +
        sorted.slice(0, 14).map(([p, c]) =>
          `<button type="button" class="chip-btn ${activePack === p ? 'active' : ''}" onclick="selectPack('${esc(p)}')">${esc(p)} (${c})</button>`
        ).join("");
    }

      document.getElementById("packFilter").value = p;

      document.getElementById("otherPills").innerHTML = ALL_SYSTEMS.map(s => `

    function dimName(d) {
      if (d === "nether") return "The Nether";
      if (d === "end") return "The End";

    function renderWorld() {
      const vi = currentLang === "vi";
      const source = currentMode === "biomes" ? BIOMES_DATA : STRUCTURES_DATA;
      const q = document.getElementById("worldSearchInput").value.trim().toLowerCase();
      document.getElementById("worldClearBtn").style.display = q ? "block" : "none";
      const dim = document.getElementById("dimFilter").value;
      const pack = document.getElementById("packFilter").value;

      const filtered = source.filter(x => {
        if (dim !== "all" && x.dim !== dim) return false;
        if (pack !== "all" && x.pack !== pack) return false;
        if (q) {
          const hay = [x.id, x.name_en, x.name_vi, x.pack, x.where_en, x.where_vi, x.spawns_en, x.spawns_vi].filter(Boolean).join(" ").toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
      if (currentPage > totalPages) currentPage = totalPages;
      const start = (currentPage - 1) * PAGE_SIZE;
      const slice = filtered.slice(start, start + PAGE_SIZE);

      document.getElementById("resultsCount").textContent = vi
        ? `Đang hiển thị ${filtered.length} / ${source.length} ${currentMode === "biomes" ? "Biomes" : "Công trình"}`
        : `Showing ${filtered.length} of ${source.length} ${currentMode === "biomes" ? "Biomes" : "Structures"}`;

      document.getElementById("pageInfo").textContent = `${currentPage} / ${totalPages}`;
      document.getElementById("prevBtn").disabled = currentPage <= 1;
      document.getElementById("nextBtn").disabled = currentPage >= totalPages;

      window._CURRENT_SLICE = slice;
      document.getElementById("worldGrid").innerHTML = slice.map((x, idx) => `
        <div class="w-card" onclick="openWorldModal(${idx})">
          <div class="w-name">${esc(vi ? x.name_vi : x.name_en)}</div>
          <div class="w-id">${esc(x.id)}</div>
          <div class="badge-row">
            <span class="badge dim-${x.dim}">${dimName(x.dim)}</span>
            <span class="badge">${esc(x.pack)}</span>
            ${x.where_en ? `<span class="badge where-pill">${esc(vi ? x.where_vi : x.where_en)}</span>` : ""}
            ${x.layer_en ? `<span class="badge layer-pill">${esc(vi ? x.layer_vi : x.layer_en)}</span>` : ""}
          </div>
        </div>
      `).join("");
    }

    function changePage(delta) {
      currentPage += delta;
      renderWorld();
      window.scrollTo({ top: 240, behavior: "smooth" });

    let active3dCleanup = null;
    let threePromise = null;
    let atlasPromise = null;

    async function getThree() {
      if (!threePromise) {
        threePromise = import("https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js");
      }
      return threePromise;
    }

    async function getAtlasTexture(THREE) {
      if (!atlasPromise) {
        atlasPromise = new Promise((resolve, reject) => {
          new THREE.TextureLoader().load(
            "assets/data/block_atlas.png",
            tex => {
              tex.magFilter = THREE.NearestFilter;
              tex.minFilter = THREE.NearestFilter;
              tex.generateMipmaps = false;
              tex.colorSpace = THREE.SRGBColorSpace;
              resolve(tex);
            },
            undefined,
            reject
          );
        });
      }
      return atlasPromise;
    }

    function renderFallbackIso(box, dataRes, slider, yValEl, autoBtn, resetBtn) {
      const [sx, sy, sz] = dataRes.s;
      const [cols] = dataRes.a || [25, 24];
      const mats = dataRes.m || [];
      const b = dataRes.b || [];
      const items = [];
      for (let i = 0; i < b.length; i += 4) items.push([b[i], b[i + 1], b[i + 2], b[i + 3]]);

      const canvas = document.createElement("canvas");
      const w = box.clientWidth || 640;
      const h = box.clientHeight || 340;
      canvas.width = w;
      canvas.height = h;
      box.appendChild(canvas);
      const ctx = canvas.getContext("2d");
      ctx.imageSmoothingEnabled = false;

      const atlasImg = new Image();
      let atlasReady = false;
      atlasImg.onload = () => { atlasReady = true; draw(); };
      atlasImg.src = "assets/data/block_atlas.png";

      let yaw = Math.PI * 0.25;
      let pitch = 0.55;
      let zoom = Math.min(w, h) / (Math.max(sx, sy, sz, 6) * 2.1);
      let autoRot = true;
      let yMax = sy;
      let dragging = false, lx = 0, ly = 0;

      const cx = sx / 2 - 0.5, cy = sy / 2 - 0.5, cz = sz / 2 - 0.5;
      const draw = () => {
        ctx.clearRect(0, 0, w, h);
        ctx.imageSmoothingEnabled = false;
        const cosY = Math.cos(yaw), sinY = Math.sin(yaw);
        const cosP = Math.cos(pitch), sinP = Math.sin(pitch);
        const proj = [];
        for (let i = 0; i < items.length; i++) {
          const [x, y, z, mi] = items[i];
          if (y >= yMax) continue;
          const dx = x - cx, dy = y - cy, dz = z - cz;
          const rx = dx * cosY - dz * sinY;
          const rz = dx * sinY + dz * cosY;
          const ry = dy * cosP - rz * sinP;
          const depth = dy * sinP + rz * cosP;
          const mEntry = mats[mi] || [-1, 0x8a8f99];
          proj.push({ sx: w / 2 + rx * zoom, sy: h / 2 - ry * zoom, depth, tile: mEntry[0], col: mEntry[1] ?? 0x8a8f99 });
        }
        proj.sort((a, b) => a.depth - b.depth);
        const szPx = Math.max(3, zoom * 1.15);
        for (let i = 0; i < proj.length; i++) {
          const p = proj[i];
          if (atlasReady && p.tile >= 0) {
            const tx = (p.tile % cols) * 16;
            const ty = Math.floor(p.tile / cols) * 16;
            ctx.drawImage(atlasImg, tx, ty, 16, 16, p.sx - szPx / 2, p.sy - szPx / 2, szPx, szPx);
          } else {
            const c = p.col === 0xffffff ? 0x9ca3af : p.col;
            ctx.fillStyle = "#" + c.toString(16).padStart(6, "0");
            ctx.fillRect(p.sx - szPx / 2, p.sy - szPx / 2, szPx, szPx);
          }
        }
      };

      canvas.onpointerdown = e => { dragging = true; lx = e.clientX; ly = e.clientY; canvas.setPointerCapture(e.pointerId); };
      canvas.onpointermove = e => {
        if (!dragging) return;
        yaw += (e.clientX - lx) * 0.012;
        pitch = Math.max(-1.2, Math.min(1.2, pitch + (e.clientY - ly) * 0.01));
        lx = e.clientX; ly = e.clientY;
        draw();
      };
      canvas.onpointerup = () => { dragging = false; };
      canvas.onwheel = e => { e.preventDefault(); zoom = Math.max(2, Math.min(40, zoom * (e.deltaY > 0 ? 0.9 : 1.1))); draw(); };

      if (slider) slider.oninput = () => { yMax = parseInt(slider.value, 10); if (yValEl) yValEl.textContent = `Y ≤ ${yMax}`; draw(); };
      if (autoBtn) autoBtn.onclick = () => { autoRot = !autoRot; autoBtn.classList.toggle("on", autoRot); };
      if (resetBtn) resetBtn.onclick = () => { yaw = Math.PI * 0.25; pitch = 0.55; zoom = Math.min(w, h) / (Math.max(sx, sy, sz, 6) * 2.1); draw(); };

      let raf = 0;
      const tick = () => {
        raf = requestAnimationFrame(tick);
        if (autoRot && !dragging) { yaw += 0.008; draw(); }
      };
      draw();
      tick();
      return () => { cancelAnimationFrame(raf); canvas.remove(); };
    }

    async function mount3dViewer(file, vi) {
      if (active3dCleanup) { active3dCleanup(); active3dCleanup = null; }
      const box = document.getElementById("viewerCanvasBox");
      const status = document.getElementById("viewerStatus");
      if (!box) return;
      if (window.location.protocol === "file:") {
        if (status) status.textContent = vi
          ? "Trình duyệt chặn tải 3D ở chế độ file://. Hãy mở qua GitHub Pages hoặc http://localhost:8080"
          : "Browser blocks 3D fetch on file://. Open via GitHub Pages or http://localhost:8080";
        return;
      }
      let dataRes;
      try {
        const resp = await fetch(`assets/data/structures_3d/${file}`);
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        dataRes = await resp.json();
      } catch (err) {
        if (status) status.textContent = vi ? `Không thể tải dữ liệu 3D (${err.message}).` : `Failed to load 3D data (${err.message}).`;
        return;
      }
      if (!document.getElementById("viewerCanvasBox")) return;

      const [sx, sy, sz] = dataRes.s;
      const orig = dataRes.orig || dataRes.s;
      const [cols, rows] = dataRes.a || [25, 24];
      const mats = dataRes.m || [];
      const b = dataRes.b || [];
      const totalBlocks = Math.floor(b.length / 4);

      const dimLabel = document.getElementById("viewerDimsLabel");
      if (dimLabel) {
        dimLabel.textContent = `${orig[0]}×${orig[1]}×${orig[2]} • ${totalBlocks} blocks${dataRes.lod > 1 ? ` (${dataRes.lod}x LOD)` : ""}`;
      }
      const slider = document.getElementById("ySliceSlider");
      const yValEl = document.getElementById("ySliceVal");
      if (slider) {
        slider.max = sy;
        slider.value = sy;
        if (yValEl) yValEl.textContent = `Y ≤ ${sy}`;
      }
      const autoBtn = document.getElementById("autoRotBtn");
      const resetBtn = document.getElementById("resetCamBtn");

      try {
        const THREE = await getThree();
        const atlasTex = await getAtlasTexture(THREE);
        if (!document.getElementById("viewerCanvasBox")) return;
        if (status) status.style.display = "none";

        const w = box.clientWidth || 640;
        const h = box.clientHeight || 340;
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 1000);
        const maxDim = Math.max(sx, sy, sz, 6);
        let radius = maxDim * 1.65;
        let theta = Math.PI * 0.25;
        let phi = 1.05;
        let autoRotate = true;

        const updateCam = () => {
          camera.position.set(
            radius * Math.sin(phi) * Math.cos(theta),
            radius * Math.cos(phi),
            radius * Math.sin(phi) * Math.sin(theta)
          );
          camera.lookAt(0, 0, 0);
        };
        updateCam();

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(w, h);
        box.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.92));
        const dir1 = new THREE.DirectionalLight(0xfff4d6, 0.85);
        dir1.position.set(1.2, 2.0, 1.0);
        scene.add(dir1);
        const dir2 = new THREE.DirectionalLight(0x93c5fd, 0.4);
        dir2.position.set(-1.2, -0.5, -1.0);
        scene.add(dir2);

        const geo = new THREE.BoxGeometry(1, 1, 1);
        const tileOffsets = new Float32Array(totalBlocks * 2);
        const tileAttr = new THREE.InstancedBufferAttribute(tileOffsets, 2);
        geo.setAttribute("aTile", tileAttr);

        const mat = new THREE.ShaderMaterial({
          uniforms: {
            uAtlas: { value: atlasTex },
            uTileSize: { value: new THREE.Vector2(1 / cols, 1 / rows) }
          },
          vertexShader: `
            attribute vec2 aTile;
            varying vec2 vTile;
            varying vec2 vUv;
            varying vec3 vTint;
            varying float vShade;
            void main() {
              vTile = aTile;
              vUv = uv;
              #ifdef USE_INSTANCING_COLOR
                vTint = instanceColor;
              #else
                vTint = vec3(1.0);
              #endif
              vec3 n = normalize(normal);
              vShade = n.y > 0.5 ? 1.0 : (n.y < -0.5 ? 0.55 : (abs(n.x) > 0.5 ? 0.82 : 0.72));
              gl_Position = projectionMatrix * modelViewMatrix * instanceMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform sampler2D uAtlas;
            uniform vec2 uTileSize;
            varying vec2 vTile;
            varying vec2 vUv;
            varying vec3 vTint;
            varying float vShade;
            void main() {
              vec3 baseCol = vTint;
              if (vTile.x >= 0.0) {
                vec2 insetUv = mix(vec2(0.015), vec2(0.985), vUv);
                vec4 tex = texture2D(uAtlas, vTile + insetUv * uTileSize);
                if (tex.a < 0.15) discard;
                baseCol = tex.rgb * vTint;
              }
              gl_FragColor = vec4(baseCol * vShade, 1.0);
            }
          `
        });

        const mesh = new THREE.InstancedMesh(geo, mat, totalBlocks);
        const dummy = new THREE.Object3D();
        const col = new THREE.Color();

        const items = [];
        for (let i = 0; i < b.length; i += 4) items.push([b[i], b[i + 1], b[i + 2], b[i + 3]]);
        items.sort((p, q) => p[1] - q[1]);

        const cx = sx / 2 - 0.5;
        const cy = sy / 2 - 0.5;
        const cz = sz / 2 - 0.5;
        const yCutoffCount = new Array(sy + 1).fill(0);
        for (let i = 0; i < items.length; i++) {
          const [x, y, z, mi] = items[i];
          dummy.position.set(x - cx, y - cy, z - cz);
          dummy.updateMatrix();
          mesh.setMatrixAt(i, dummy.matrix);

          const mEntry = mats[mi] || [-1, 0x8a8f99];
          const tileIdx = mEntry[0];
          const tint = mEntry[1] ?? 0xffffff;
          col.setHex(tint);
          mesh.setColorAt(i, col);

          if (tileIdx >= 0) {
            const cIdx = tileIdx % cols;
            const rIdx = Math.floor(tileIdx / cols);
            tileOffsets[i * 2] = cIdx / cols;
            tileOffsets[i * 2 + 1] = 1.0 - (rIdx + 1) / rows;
          } else {
            tileOffsets[i * 2] = -1.0;
            tileOffsets[i * 2 + 1] = -1.0;
          }
          if (y + 1 <= sy) yCutoffCount[y + 1] = i + 1;
        }
        for (let y = 1; y <= sy; y++) {
          if (yCutoffCount[y] === 0) yCutoffCount[y] = yCutoffCount[y - 1];
        }
        tileAttr.needsUpdate = true;
        mesh.instanceMatrix.needsUpdate = true;
        if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
        scene.add(mesh);

        let dragging = false, lx = 0, ly = 0;
        const dom = renderer.domElement;
        dom.onpointerdown = e => { dragging = true; lx = e.clientX; ly = e.clientY; dom.setPointerCapture(e.pointerId); };
        dom.onpointermove = e => {
          if (!dragging) return;
          theta += (e.clientX - lx) * 0.01;
          phi = Math.max(0.2, Math.min(Math.PI - 0.2, phi - (e.clientY - ly) * 0.01));
          lx = e.clientX; ly = e.clientY;
          updateCam();
        };
        dom.onpointerup = () => { dragging = false; };
        dom.onwheel = e => {
          e.preventDefault();
          radius = Math.max(4, Math.min(maxDim * 5, radius * (e.deltaY > 0 ? 1.1 : 0.9)));
          updateCam();
        };

        if (slider) {
          slider.oninput = () => {
            const yMax = parseInt(slider.value, 10);
            mesh.count = yCutoffCount[yMax] ?? totalBlocks;
            if (yValEl) yValEl.textContent = `Y ≤ ${yMax}`;
          };
        }
        if (autoBtn) {
          autoBtn.onclick = () => {
            autoRotate = !autoRotate;
            autoBtn.classList.toggle("on", autoRotate);
          };
        }
        if (resetBtn) {
          resetBtn.onclick = () => {
            radius = maxDim * 1.65; theta = Math.PI * 0.25; phi = 1.05;
            updateCam();
          };
        }

        let rafId = 0;
        const animate = () => {
          rafId = requestAnimationFrame(animate);
          if (autoRotate && !dragging) {
            theta += 0.006;
            updateCam();
          }
          renderer.render(scene, camera);
        };
        animate();

        active3dCleanup = () => {
          cancelAnimationFrame(rafId);
          geo.dispose();
          mat.dispose();
          renderer.dispose();
          if (dom.parentNode) dom.remove();
        };
      } catch (err) {
        if (status) status.style.display = "none";
        active3dCleanup = renderFallbackIso(box, dataRes, slider, yValEl, autoBtn, resetBtn);
      }
    }

          </div>
        </div>` : ""}
        ${x.spawns_en ? `<div class="modal-sec"><strong>${vi ? "Có thể xuất hiện tại (Biomes):" : "Spawn Biomes:"}</strong> ${esc(vi ? x.spawns_vi : x.spawns_en)}</div>` : ""}
        ${x.step ? `<div class="modal-sec"><strong>${vi ? "Tầng tạo sinh (Generation Step):" : "Generation Step:"}</strong> ${esc(x.step)}</div>` : ""}
        <div class="modal-sec">
          <strong>${vi ? "ID / Lệnh tham khảo:" : "Reference ID / Locate Command:"}</strong>
          <code>${esc(cmd)}</code>
        </div>
      `;
      document.getElementById("worldModal").classList.add("active");
      if (x.has3d) mount3dViewer(x.has3d, vi);
    }

    function closeWorldModal() {
      if (active3dCleanup) { active3dCleanup(); active3dCleanup = null; }
      document.getElementById("worldModal").classList.remove("active");
    }

    document.getElementById("worldSearchInput").addEventListener("input", () => { currentPage = 1; renderWorld(); });
    document.getElementById("worldClearBtn").addEventListener("click", () => {
      document.getElementById("worldSearchInput").value = "";
      currentPage = 1;
      renderWorld();
    });
    document.getElementById("dimFilter").addEventListener("change", () => { currentPage = 1; renderWorld(); });
    document.getElementById("packFilter").addEventListener("change", () => {
      currentPage = 1;
      populatePackFilters();
      renderWorld();
    });
    document.getElementById("worldModal").addEventListener("click", e => {
      if (e.target.id === "worldModal") closeWorldModal();
    });
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") closeWorldModal();
    });

    applyLang();
  </script>
</body>
</html>
