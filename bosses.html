<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- OME Embed Meta -->
  <meta name="theme-color" content="#f5c451" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="One More Expedition • KHTN 26.3" />
  <meta property="og:title" content="Custom Items & Bosses — One More Expedition Wiki" />
  <meta property="og:description" content="Browse 145+ custom-textured items (Stellarity, Incendium, Katters, DnT) and 14 server Boss encounters." />
  <meta property="og:url" content="https://tano-dev.github.io/Minecraft-One-More-Expedition-Wiki/bosses.html" />

  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Custom Items & Bosses — One More Expedition Wiki" />
  <meta name="twitter:description" content="Browse 145+ custom-textured items (Stellarity, Incendium, Katters, DnT) and 14 server Boss encounters." />
  <meta name="twitter:image" content="https://tano-dev.github.io/Minecraft-One-More-Expedition-Wiki/assets/server-icon.png" />
  <!-- /OME Embed Meta -->
  <title>Custom Items &amp; Bosses — One More Expedition Wiki</title>
  <link rel="icon" type="image/png" href="assets/server-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/wiki-header.css" />
  <script src="assets/wiki-lang-sync.js"></script>
  <style>
    :root {
      --bg-dark: #0d131f;
      --card-bg: rgba(18, 24, 38, 0.9);
      --card-inner: rgba(25, 34, 52, 0.82);
      --border-card: rgba(255, 255, 255, 0.1);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --gold-primary: #f5c451;
      --aqua: #38bdf8;
      --green: #4ade80;
      --epic: #e879f9;
      --mythic: #f472b6;
      --red: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.55;
      background-color: var(--bg-dark);
      position: relative;
      -webkit-font-smoothing: antialiased;
    }
    .minecraft-bg-fixed {
      position: fixed;
      inset: 0;
      z-index: -10;
      pointer-events: none;
      background: #101726 url('assets/bg.jpg') no-repeat center center / cover;
    }
    .minecraft-bg-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 25%, rgba(15, 23, 42, 0.48) 0%, rgba(7, 10, 18, 0.88) 100%);
    }
    .mc-pixel { image-rendering: pixelated; image-rendering: crisp-edges; }

    .page-wrap {
      max-width: 1260px;
      margin: 0 auto;
      padding: 24px 20px 64px;
    }
    .back-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 700;
      transition: all 0.2s;
    }
    .back-btn:hover {
      background: rgba(245, 196, 81, 0.14);
      border-color: rgba(245, 196, 81, 0.45);
      color: var(--gold-primary);
    }

    /* Hero */
    .hero-card {
      background: linear-gradient(135deg, rgba(24, 34, 54, 0.94), rgba(15, 23, 38, 0.96));
      border: 1px solid rgba(245, 196, 81, 0.28);
      border-radius: 18px;
      padding: 24px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.45);
      margin-bottom: 20px;
    }
    .hero-left {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .hero-icon-box {
      width: 68px;
      height: 68px;
      border-radius: 16px;
      background: rgba(245, 196, 81, 0.12);
      border: 1px solid rgba(245, 196, 81, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .hero-icon-box img { width: 44px; height: 44px; }
    .hero-title {
      font-size: 1.7rem;
      font-weight: 800;
      color: #fef08a;
      line-height: 1.2;
    }
    .hero-sub {
      color: #93c5fd;
      font-size: 0.92rem;
      font-weight: 700;
      margin-top: 4px;
    }
    .hero-desc {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 6px;
      max-width: 680px;
    }

    /* 2 Primary Mode Buttons */
    .mode-switch-bar {
      display: grid;
      grid-template-columns: repeat(2, minmax(220px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }
    .mode-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 16px 20px;
      border-radius: 14px;
      background: rgba(18, 25, 40, 0.88);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
      font-family: inherit;
    }
    .mode-btn:hover {
      border-color: rgba(245, 196, 81, 0.45);
      background: rgba(28, 38, 60, 0.92);
      transform: translateY(-2px);
    }
    .mode-btn.active {
      background: linear-gradient(135deg, rgba(245, 196, 81, 0.18), rgba(56, 189, 248, 0.1));
      border-color: var(--gold-primary);
      color: #fef08a;
      box-shadow: 0 10px 28px rgba(245, 196, 81, 0.14);
    }
    .mode-btn-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .mode-btn-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .mode-btn-icon img { width: 28px; height: 28px; }
    .mode-btn-title { font-size: 1.08rem; font-weight: 800; }
    .mode-btn-sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }
    .mode-count-pill {
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      font-weight: 700;
      color: #f8fafc;
    }
    .mode-btn.active .mode-count-pill {
      background: rgba(245, 196, 81, 0.22);
      border-color: rgba(245, 196, 81, 0.55);
      color: #fde68a;
    }

    /* Filter Panel */
    .filter-panel {
      background: var(--card-bg);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 20px;
    }
    .search-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 14px;
    }
    .search-box {
      flex: 1 1 300px;
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-box .search-ico {
      position: absolute;
      left: 13px;
      width: 16px;
      height: 16px;
      pointer-events: none;
    }
    .search-box input {
      width: 100%;
      padding: 10px 36px 10px 38px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(10, 15, 25, 0.85);
      color: var(--text-main);
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
    }
    .search-box input:focus { border-color: var(--gold-primary); }
    .clear-btn {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
      display: none;
    }
    .filter-select {
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(10, 15, 25, 0.88);
      color: var(--text-main);
      font-size: 0.85rem;
      font-family: inherit;
      cursor: pointer;
    }
    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .chip-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
      color: #cbd5e1;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .chip-btn img { width: 14px; height: 14px; }
    .chip-btn:hover { border-color: rgba(245, 196, 81, 0.45); color: #fef08a; }
    .chip-btn.active {
      background: rgba(245, 196, 81, 0.2);
      border-color: var(--gold-primary);
      color: #fde68a;
    }

    .results-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      font-size: 0.85rem;
      color: var(--text-muted);
      flex-wrap: wrap;
      gap: 8px;
    }

    /* Grids & Cards */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 14px;
    }
    .bosses-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 16px;
    }
    .item-card, .boss-card {
      background: var(--card-bg);
      border: 1px solid var(--border-card);
      border-radius: 14px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .item-card:hover, .boss-card:hover {
      border-color: rgba(245, 196, 81, 0.55);
      transform: translateY(-2px);
      background: rgba(24, 33, 52, 0.95);
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.35);
    }
    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .item-icon-wrap {
      width: 46px;
      height: 46px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .item-icon-wrap img { width: 32px; height: 32px; object-fit: contain; }
    .card-title { font-size: 1rem; font-weight: 800; line-height: 1.25; }
    .card-sub-id {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.06);
      color: #e2e8f0;
    }
    .rar-mythic { color: #f472b6; border-color: rgba(244, 114, 182, 0.45); background: rgba(244, 114, 182, 0.14); }
    .rar-legendary { color: #f5c451; border-color: rgba(245, 196, 81, 0.45); background: rgba(245, 196, 81, 0.14); }
    .rar-epic { color: #e879f9; border-color: rgba(232, 121, 249, 0.45); background: rgba(232, 121, 249, 0.14); }
    .rar-rare { color: #38bdf8; border-color: rgba(56, 189, 248, 0.45); background: rgba(56, 189, 248, 0.14); }
    .rar-uncommon { color: #4ade80; border-color: rgba(74, 222, 128, 0.45); background: rgba(74, 222, 128, 0.14); }
    .stat-pill {
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #bae6fd;
      font-size: 0.73rem;
      font-weight: 700;
    }
    .hp-pill {
      padding: 3px 9px;
      border-radius: 6px;
      background: rgba(248, 113, 113, 0.16);
      border: 1px solid rgba(248, 113, 113, 0.42);
      color: #fecaca;
      font-size: 0.74rem;
      font-weight: 800;
    }
    .card-desc {
      font-size: 0.82rem;
      color: #cbd5e1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-obtain {
      margin-top: auto;
      padding-top: 8px;
      border-top: 1px dashed rgba(255, 255, 255, 0.08);
      font-size: 0.76rem;
      color: #93c5fd;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card-obtain img { width: 13px; height: 13px; flex-shrink: 0; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 15, 0.82);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 18px;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      width: 100%;
      max-width: 680px;
      max-height: 90vh;
      overflow-y: auto;
      background: #121928;
      border: 1px solid rgba(245, 196, 81, 0.38);
      border-radius: 18px;
      padding: 24px;
      position: relative;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
    }
    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      color: #e2e8f0;
      cursor: pointer;
      font-size: 1rem;
    }
    .modal-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
      padding-right: 36px;
    }
    .modal-icon-big {
      width: 60px;
      height: 60px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(245, 196, 81, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .modal-icon-big img { width: 42px; height: 42px; object-fit: contain; }
    .modal-section {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .modal-sec-title {
      font-size: 0.76rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--gold-primary);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .modal-sec-title img { width: 14px; height: 14px; }
    .drop-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 8px;
      background: rgba(245, 196, 81, 0.12);
      border: 1px solid rgba(245, 196, 81, 0.35);
      color: #fde68a;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }
    .drop-link-btn:hover { background: rgba(245, 196, 81, 0.24); }
    .drop-static-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* Other systems */
    .other-systems {
      margin-top: 36px;
      padding-top: 22px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .other-title { font-size: 0.9rem; font-weight: 800; color: var(--text-muted); margin-bottom: 12px; }
    .other-pills { display: flex; flex-wrap: wrap; gap: 8px; }
    .other-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .other-pill:hover { border-color: rgba(245, 196, 81, 0.45); color: #fef08a; }
    .other-pill img { width: 16px; height: 16px; }

    @media (max-width: 680px) {
      .mode-switch-bar { grid-template-columns: 1fr; }
      .bosses-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="minecraft-bg-fixed"><div class="minecraft-bg-overlay"></div></div>

  <header class="ome-header">
    <a href="main.html" class="ome-brand">
      <img class="ome-brand-icon" src="assets/server-icon.png" alt="OME Logo" />
      <div class="ome-brand-text">
        <span class="ome-brand-title">One More Expedition</span>
        <span class="ome-brand-sub">KHTN Server Wiki • 26.3</span>
      </div>
    </a>

    <nav class="ome-nav">
      <a href="main.html" class="ome-nav-btn" style="border-color: rgba(59, 130, 246, 0.45); color: #93c5fd;">
        <img src="assets/icons/grass_block_side.png" alt=""/>
        <span data-i18n="navHome">Trang Chủ</span>
      </a>
      <a href="enchants.html" class="ome-nav-btn" style="color: #f5c451; border-color: rgba(245, 196, 81, 0.45);">
        <img src="assets/icons/enchanted_book.png" alt=""/>
        <span data-i18n="navEnchants">Bách Khoa Phù Phép</span>
      </a>
      <a href="fishing.html" class="ome-nav-btn" style="color: #38bdf8; border-color: rgba(56, 189, 248, 0.45);">
        <img src="assets/icons/fishing_rod.png" alt=""/>
        <span data-i18n="navFishing">Bách Khoa Câu Cá</span>
      </a>
      <a href="world.html" class="ome-nav-btn" style="color: #4ade80; border-color: rgba(74, 222, 128, 0.45);">
        <img src="assets/icons/spyglass.png" alt=""/>
        <span>Biomes &amp; Structures</span>
      </a>
    </nav>

    <div class="ome-header-right">
      <div class="ome-lang-pill">
        <button class="ome-lang-btn" id="btnLangEn" onclick="setLanguage('en')">🇺🇸 EN</button>
        <button class="ome-lang-btn active" id="btnLangVi" onclick="setLanguage('vi')">🇻🇳 VI</button>
      </div>
    </div>
  </header>

  <main class="page-wrap">
    <div class="back-bar">
      <a href="main.html" class="back-btn" id="backHomeBtn">← Quay lại Trang Chủ</a>
    </div>

    <section class="hero-card">
      <div class="hero-left">
        <div class="hero-icon-box">
          <img class="mc-pixel" src="assets/icons/dragonblade.png" alt="Items & Bosses" />
        </div>
        <div>
          <h1 class="hero-title" id="heroTitle">Custom Items &amp; Bosses</h1>
          <p class="hero-sub" id="heroSub">Items • Bosses</p>
          <p class="hero-desc" id="heroDesc"></p>
        </div>
      </div>
    </section>

    <!-- 2 Primary Mode Buttons: Custom Items & Bosses -->
    <div class="mode-switch-bar">
      <button type="button" class="mode-btn active" id="modeItemsBtn" onclick="switchMode('items')">
        <div class="mode-btn-left">
          <div class="mode-btn-icon"><img class="mc-pixel" src="assets/icons/dragonblade.png" alt=""/></div>
          <div>
            <div class="mode-btn-title" id="modeItemsTitle">Vật Phẩm Tùy Chỉnh (Custom Items)</div>
            <div class="mode-btn-sub" id="modeItemsSub">Vũ khí, Giáp, Cổ vật, Phép &amp; Chìa khóa</div>
          </div>
        </div>
        <span class="mode-count-pill" id="itemsTotalPill">0</span>
      </button>

      <button type="button" class="mode-btn" id="modeBossesBtn" onclick="switchMode('bosses')">
        <div class="mode-btn-left">
          <div class="mode-btn-icon"><img class="mc-pixel" src="assets/icons/nether_star.png" alt=""/></div>
          <div>
            <div class="mode-btn-title" id="modeBossesTitle">Trùm &amp; Săn Boss (Bosses)</div>
            <div class="mode-btn-sub" id="modeBossesSub">Stellarity, Incendium, Wither, Katters, DDD &amp; DnT</div>
          </div>
        </div>
        <span class="mode-count-pill" id="bossesTotalPill">0</span>
      </button>
    </div>

    <!-- ITEMS SECTION -->
    <section id="itemsSection">
      <div class="filter-panel">
        <div class="search-row">
          <div class="search-box">
            <img class="search-ico mc-pixel" src="assets/icons/compass.png" alt=""/>
            <input type="text" id="itemSearchInput" placeholder="Tìm vật phẩm theo tên, chỉ số, hiệu ứng hoặc cách sở hữu..." autocomplete="off" />
            <button type="button" class="clear-btn" id="itemClearBtn">✕</button>
          </div>
          <select id="itemPackSelect" class="filter-select">
            <option value="all">Pack: Tất cả</option>
            <option value="stellarity">Stellarity</option>
            <option value="incendium">Incendium</option>
            <option value="kattersstructures">Katters Structures</option>
            <option value="wawo">Warping Wonders</option>
            <option value="dnt">Dungeons &amp; Taverns</option>
          </select>
          <select id="itemSortSelect" class="filter-select">
            <option value="name">Sắp xếp: Tên (A-Z)</option>
            <option value="pack">Sắp xếp: Pack</option>
          </select>
        </div>

        <div class="chip-row" id="itemCategoryChips">
          <button type="button" class="chip-btn active" data-cat="all" id="catAll">Tất cả</button>
          <button type="button" class="chip-btn" data-cat="weapon"><img class="mc-pixel" src="assets/icons/netherite_sword.png" alt=""/> <span id="catWeapon">Vũ khí</span></button>
          <button type="button" class="chip-btn" data-cat="ranged"><img class="mc-pixel" src="assets/icons/spyglass.png" alt=""/> <span id="catRanged">Tầm xa</span></button>
          <button type="button" class="chip-btn" data-cat="armor"><img class="mc-pixel" src="assets/icons/shield.png" alt=""/> <span id="catArmor">Giáp &amp; Cánh</span></button>
          <button type="button" class="chip-btn" data-cat="tool"><img class="mc-pixel" src="assets/icons/diamond_pickaxe.png" alt=""/> <span id="catTool">Công cụ</span></button>
          <button type="button" class="chip-btn" data-cat="spellbook"><img class="mc-pixel" src="assets/icons/enchanted_book.png" alt=""/> <span id="catSpell">Sách phép</span></button>
          <button type="button" class="chip-btn" data-cat="trinket"><img class="mc-pixel" src="assets/icons/totem_of_undying.png" alt=""/> <span id="catTrinket">Phụ kiện &amp; Khiên</span></button>
          <button type="button" class="chip-btn" data-cat="key"><img class="mc-pixel" src="assets/icons/ender_pearl.png" alt=""/> <span id="catKey">Chìa khóa &amp; Tiện ích</span></button>
          <button type="button" class="chip-btn" data-cat="consumable"><img class="mc-pixel" src="assets/icons/blaze_powder.png" alt=""/> <span id="catConsumable">Nguyên liệu &amp; Đồ ăn</span></button>
        </div>
      </div>

      <div class="results-bar">
        <span id="itemResultsCount"></span>
        <span id="itemClickHint"></span>
      </div>
      <div class="cards-grid" id="itemsGrid"></div>
    </section>

    <!-- BOSSES SECTION -->
    <section id="bossesSection" style="display:none;">
      <div class="filter-panel">
        <div class="search-row">
          <div class="search-box">
            <img class="search-ico mc-pixel" src="assets/icons/compass.png" alt=""/>
            <input type="text" id="bossSearchInput" placeholder="Tìm boss theo tên, khu vực, cơ chế hoặc vật phẩm rơi..." autocomplete="off" />
            <button type="button" class="clear-btn" id="bossClearBtn">✕</button>
          </div>
        </div>
        <div class="chip-row" id="bossDimChips">
          <button type="button" class="chip-btn active" data-dim="all" id="dimAll">Tất cả Boss</button>
          <button type="button" class="chip-btn" data-dim="end"><img class="mc-pixel" src="assets/icons/dragon_egg.png" alt=""/> <span id="dimEnd">The End (Stellarity / Dragon)</span></button>
          <button type="button" class="chip-btn" data-dim="nether"><img class="mc-pixel" src="assets/icons/nether_star.png" alt=""/> <span id="dimNether">The Nether (Incendium / Wither)</span></button>
          <button type="button" class="chip-btn" data-dim="overworld"><img class="mc-pixel" src="assets/icons/netherite_sword.png" alt=""/> <span id="dimKatters">Katters Structures</span></button>
          <button type="button" class="chip-btn" data-dim="ddd"><img class="mc-pixel" src="assets/icons/blaze_powder.png" alt=""/> <span id="dimDdd">DDD Dungeons</span></button>
          <button type="button" class="chip-btn" data-dim="dnt"><img class="mc-pixel" src="assets/icons/chest_front.png" alt=""/> <span id="dimDnt">DnT / Nova Structures</span></button>
        </div>
      </div>

      <div class="results-bar">
        <span id="bossResultsCount"></span>
        <span id="bossClickHint"></span>
      </div>
      <div class="bosses-grid" id="bossesGrid"></div>
    </section>

    <section class="other-systems">
      <div class="other-title" id="otherTitle">Khám Phá Hệ Thống Khác</div>
      <div class="other-pills" id="otherPills"></div>
    </section>
  </main>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-box">
      <button type="button" class="modal-close" onclick="closeDetailModal()">✕</button>
      <div class="modal-header">
        <div class="modal-icon-big"><img class="mc-pixel" id="modalIcon" src="assets/icons/dragonblade.png" alt=""/></div>
        <div>
          <h2 id="modalTitle" style="font-size:1.3rem;font-weight:800;line-height:1.2;">Title</h2>
          <div id="modalSub" style="font-family:'JetBrains Mono',monospace;font-size:0.78rem;color:#94a3b8;margin-top:4px;"></div>
          <div class="badge-row" id="modalBadges" style="margin-top:8px;"></div>
        </div>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="assets/js/items_bosses_data.js"></script>
  <script>
    const LANG_KEY = "ome_wiki_lang";
    let currentLang = localStorage.getItem(LANG_KEY) || "vi";
    let currentMode = "items";
    let currentCat = "all";
    let currentDim = "all";

    const ALL_SYSTEMS = [
      { id: "skyblock", icon: "assets/icons/oak_sapling.png", name: { vi: "Skyblock", en: "Skyblock" }, href: "skyblock.html" },
      { id: "world", icon: "assets/icons/spyglass.png", name: { vi: "Biomes & Structures", en: "Biomes & Structures" }, href: "world.html" },
      { id: "adventure", icon: "assets/icons/compass.png", name: { vi: "Adventure", en: "Adventure" }, href: "adventure.html" },
      { id: "enchants", icon: "assets/icons/enchanted_book.png", name: { vi: "Enchantments", en: "Enchantments" }, href: "enchants.html" },
      { id: "fishing", icon: "assets/icons/fishing_rod.png", name: { vi: "Fishing", en: "Fishing" }, href: "fishing.html" },
      { id: "minetreasure", icon: "assets/icons/netherite_pickaxe.png", name: { vi: "Mine Treasure", en: "Mine Treasure" }, href: "minetreasure.html" },
      { id: "warping", icon: "assets/icons/ender_pearl.png", name: { vi: "Teleports", en: "Teleports" }, href: "warping.html" },
      { id: "quests", icon: "assets/icons/writable_book.png", name: { vi: "Daily Quests", en: "Daily Quests" }, href: "quests.html" },
      { id: "economy", icon: "assets/icons/emerald.png", name: { vi: "Economy", en: "Economy" }, href: "economy.html" },
      { id: "prefix", icon: "assets/icons/name_tag.png", name: { vi: "Rank / Prefix", en: "Rank / Prefix" }, href: "prefix.html" },
      { id: "redeem", icon: "assets/icons/paper.png", name: { vi: "Codes", en: "Codes" }, href: "redeem.html" },
      { id: "utility", icon: "assets/icons/amethyst_shard.png", name: { vi: "Utility & QoL", en: "Utility & QoL" }, href: "utility.html" },
      { id: "recommended_mods", icon: "assets/icons/nether_star.png", name: { vi: "Best Client Mods", en: "Best Client Mods" }, href: "mods.html" }
    ];

    const PACK_NAMES = {
      stellarity: "Stellarity",
      incendium: "Incendium",
      kattersstructures: "Katters Structures",
      wawo: "Warping Wonders",
      dnt: "Dungeons & Taverns",
      witherswrath: "Witherswrath",
      ddd: "DDD Dungeons"
    };

    const RARITY_ORDER = { mythic: 0, legendary: 1, epic: 2, rare: 3, uncommon: 4, common: 5 };

    function esc(s) {
      return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function setLanguage(lang) {
      currentLang = lang === "en" ? "en" : "vi";
      localStorage.setItem(LANG_KEY, currentLang);
      applyLang();
    }

    window.addEventListener("storage", e => {
      if (e.key === LANG_KEY && e.newValue && e.newValue !== currentLang) {
        currentLang = e.newValue === "en" ? "en" : "vi";
        applyLang();
      }
    });

    function switchMode(mode) {
      currentMode = mode === "bosses" ? "bosses" : "items";
      document.getElementById("modeItemsBtn").classList.toggle("active", currentMode === "items");
      document.getElementById("modeBossesBtn").classList.toggle("active", currentMode === "bosses");
      document.getElementById("itemsSection").style.display = currentMode === "items" ? "block" : "none";
      document.getElementById("bossesSection").style.display = currentMode === "bosses" ? "block" : "none";
    }

    function applyLang() {
      const vi = currentLang === "vi";
      document.documentElement.lang = currentLang;
      document.getElementById("btnLangEn").classList.toggle("active", !vi);
      document.getElementById("btnLangVi").classList.toggle("active", vi);

      document.getElementById("backHomeBtn").textContent = vi ? "← Quay lại Trang Chủ" : "← Back to Main Page";
      document.getElementById("heroTitle").textContent = vi ? "Vật Phẩm Tùy Chỉnh & Trùm (Items • Bosses)" : "Custom Items & Bosses";
      document.getElementById("heroSub").textContent = "Items • Bosses";
      document.getElementById("heroDesc").textContent = vi
        ? "Tra cứu toàn bộ vật phẩm có texture riêng (Stellarity, Incendium, Katters Structures, Warping Wonders, DnT) kèm chỉ số, công dụng, cách sở hữu và toàn bộ Boss trên server."
        : "Browse all custom-textured items (Stellarity, Incendium, Katters Structures, Warping Wonders, DnT) with stats, abilities, obtain methods, and every server Boss encounter.";

      document.getElementById("modeItemsTitle").textContent = vi ? "Vật Phẩm Tùy Chỉnh (Custom Items)" : "Custom Items";
      document.getElementById("modeItemsSub").textContent = vi ? "Vũ khí, Giáp, Cổ vật, Sách phép & Chìa khóa" : "Weapons, Armor, Relics, Spellbooks & Keys";
      document.getElementById("modeBossesTitle").textContent = vi ? "Trùm & Săn Boss (Bosses)" : "Bosses & Encounters";
      document.getElementById("modeBossesSub").textContent = "Stellarity, Incendium, Wither, Katters, DDD & DnT";

      document.getElementById("itemsTotalPill").textContent = CUSTOM_ITEMS_DATA.length;
      document.getElementById("bossesTotalPill").textContent = BOSSES_DATA.length;

      document.getElementById("itemSearchInput").placeholder = vi
        ? "Tìm vật phẩm theo tên, chỉ số, hiệu ứng hoặc cách sở hữu..."
        : "Search items by name, stat, ability, or obtain source...";
      document.getElementById("bossSearchInput").placeholder = vi
        ? "Tìm boss theo tên, khu vực, cơ chế hoặc vật phẩm rơi..."
        : "Search bosses by name, location, mechanics, or drops...";

      document.getElementById("catAll").textContent = vi ? "Tất cả" : "All";
      document.getElementById("catWeapon").textContent = vi ? "Vũ khí" : "Weapons";
      document.getElementById("catRanged").textContent = vi ? "Tầm xa" : "Ranged";
      document.getElementById("catArmor").textContent = vi ? "Giáp & Cánh" : "Armor & Wings";
      document.getElementById("catTool").textContent = vi ? "Công cụ" : "Tools";
      document.getElementById("catSpell").textContent = vi ? "Sách phép" : "Spellbooks";
      document.getElementById("catTrinket").textContent = vi ? "Phụ kiện & Khiên" : "Trinkets & Shields";
      document.getElementById("catKey").textContent = vi ? "Chìa khóa & Tiện ích" : "Keys & Utility";
      document.getElementById("catConsumable").textContent = vi ? "Nguyên liệu & Đồ ăn" : "Materials & Food";

      document.getElementById("dimAll").textContent = vi ? "Tất cả Boss" : "All Bosses";
      document.getElementById("itemClickHint").textContent = vi ? "Nhấp vào thẻ để xem chỉ số & cách sở hữu" : "Click any item card for stats & obtain details";
      document.getElementById("bossClickHint").textContent = vi ? "Nhấp vào Boss để xem cơ chế & vật phẩm rơi" : "Click any boss for mechanics & drops";
      document.getElementById("otherTitle").textContent = vi ? "Khám Phá Hệ Thống Khác" : "Browse Other Systems";

      const pSel = document.getElementById("itemPackSelect");
      pSel.options[0].text = vi ? "Pack: Tất cả" : "Pack: All";
      const sSel = document.getElementById("itemSortSelect");
      sSel.options[0].text = vi ? "Sắp xếp: Tên (A-Z)" : "Sort: Name (A-Z)";
      sSel.options[1].text = vi ? "Sắp xếp: Pack" : "Sort: Pack";

      renderOtherPills();
      renderItems();
      renderBosses();
    }

    function renderOtherPills() {
      const box = document.getElementById("otherPills");
      box.innerHTML = ALL_SYSTEMS.map(s => `
        <a href="${s.href}" class="other-pill">
          <img class="mc-pixel" src="${s.icon}" alt=""/>
          <span>${esc(s.name[currentLang] || s.name.en)}</span>
        </a>
      `).join("");
    }

    function renderItems() {
      const vi = currentLang === "vi";
      const q = document.getElementById("itemSearchInput").value.trim().toLowerCase();
      document.getElementById("itemClearBtn").style.display = q ? "block" : "none";
      const pack = document.getElementById("itemPackSelect").value;
      const sortBy = document.getElementById("itemSortSelect").value;

      let list = CUSTOM_ITEMS_DATA.filter(it => {
        if (currentCat !== "all" && it.category !== currentCat) return false;
        if (pack !== "all" && it.pack !== pack) return false;
        if (q) {
          const hay = [it.id, it.name_en, it.name_vi, it.desc_en, it.desc_vi, it.obtain_en, it.obtain_vi, ...(it.stats_en || []), ...(it.stats_vi || [])].join(" ").toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      list.sort((a, b) => {
        if (sortBy === "pack") return a.pack.localeCompare(b.pack) || (vi ? a.name_vi : a.name_en).localeCompare(vi ? b.name_vi : b.name_en);
        return (vi ? a.name_vi : a.name_en).localeCompare(vi ? b.name_vi : b.name_en);
      });

      document.getElementById("itemResultsCount").textContent = vi
        ? `Đang hiển thị ${list.length} / ${CUSTOM_ITEMS_DATA.length} vật phẩm`
        : `Showing ${list.length} of ${CUSTOM_ITEMS_DATA.length} custom items`;

      const grid = document.getElementById("itemsGrid");
      grid.innerHTML = list.map(it => {
        const name = vi ? it.name_vi : it.name_en;
        const desc = vi ? it.desc_vi : it.desc_en;
        const obtain = vi ? it.obtain_vi : it.obtain_en;
        const stats = (vi ? it.stats_vi : it.stats_en) || [];
        return `
          <div class="item-card" onclick="openItemModal('${esc(it.id)}')">
            <div class="card-top">
              <div class="item-icon-wrap"><img class="mc-pixel" src="${esc(it.icon)}" alt=""/></div>
              <div style="min-width:0;">
                <div class="card-title">${esc(name)}</div>
                <div class="card-sub-id">${esc(it.id)}</div>
              </div>
            </div>
            <div class="badge-row">
              <span class="badge">${esc(PACK_NAMES[it.pack] || it.pack)}</span>
              ${stats.slice(0, 2).map(s => `<span class="stat-pill">${esc(s)}</span>`).join("")}
            </div>
            <div class="card-desc">${esc(desc)}</div>
            <div class="card-obtain">
              <img class="mc-pixel" src="assets/icons/chest_front.png" alt=""/>
              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(obtain)}</span>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderBosses() {
      const vi = currentLang === "vi";
      const q = document.getElementById("bossSearchInput").value.trim().toLowerCase();
      document.getElementById("bossClearBtn").style.display = q ? "block" : "none";

      const list = BOSSES_DATA.filter(b => {
        if (currentDim !== "all" && b.dimension !== currentDim) return false;
        if (q) {
          const hay = [
            b.name_en, b.name_vi, b.location_en, b.location_vi, b.summon_en, b.summon_vi,
            ...(b.mechanics_en || []), ...(b.mechanics_vi || []),
            ...(b.drops || []).map(d => d.label_en + " " + d.label_vi)
          ].join(" ").toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      document.getElementById("bossResultsCount").textContent = vi
        ? `Đang hiển thị ${list.length} / ${BOSSES_DATA.length} Boss`
        : `Showing ${list.length} of ${BOSSES_DATA.length} Bosses`;

      const grid = document.getElementById("bossesGrid");
      grid.innerHTML = list.map(b => {
        const name = vi ? b.name_vi : b.name_en;
        const loc = vi ? b.location_vi : b.location_en;
        const mech = (vi ? b.mechanics_vi : b.mechanics_en)[0] || "";
        return `
          <div class="boss-card" onclick="openBossModal('${esc(b.id)}')">
            <div class="card-top">
              <div class="item-icon-wrap"><img class="mc-pixel" src="${esc(b.icon)}" alt=""/></div>
              <div style="min-width:0;">
                <div class="card-title" style="color:#fef08a;">${esc(name)}</div>
                <div class="card-sub-id">${esc(loc)}</div>
              </div>
            </div>
            <div class="badge-row">
              <span class="hp-pill">${esc(b.hp)}</span>
              <span class="badge">${esc(PACK_NAMES[b.pack] || b.pack)}</span>
            </div>
            <div class="card-desc">${esc(mech)}</div>
            <div class="badge-row" style="margin-top:auto;">
              ${(b.drops || []).slice(0, 3).map(d => `<span class="stat-pill">${esc(vi ? d.label_vi : d.label_en)}</span>`).join("")}
            </div>
          </div>
        `;
      }).join("");
    }

    function openItemModal(itemId) {
      const it = CUSTOM_ITEMS_DATA.find(x => x.id === itemId);
      if (!it) return;
      const vi = currentLang === "vi";
      document.getElementById("modalIcon").src = it.icon;
      document.getElementById("modalTitle").textContent = vi ? it.name_vi : it.name_en;
      document.getElementById("modalSub").textContent = it.id;
      document.getElementById("modalBadges").innerHTML = `
        <span class="badge">${esc(PACK_NAMES[it.pack] || it.pack)}</span>
        <span class="badge">${esc(it.base_item)}</span>
      `;
      const stats = (vi ? it.stats_vi : it.stats_en) || [];
      document.getElementById("modalBody").innerHTML = `
        ${stats.length ? `
        <div class="modal-section">
          <div class="modal-sec-title"><img class="mc-pixel" src="assets/icons/netherite_sword.png" alt=""/> ${vi ? "Chỉ Số & Thuộc Tính" : "Stats & Modifiers"}</div>
          <div class="badge-row">${stats.map(s => `<span class="stat-pill">${esc(s)}</span>`).join("")}</div>
        </div>` : ""}
        <div class="modal-section">
          <div class="modal-sec-title"><img class="mc-pixel" src="assets/icons/enchanted_book.png" alt=""/> ${vi ? "Chức Năng & Hiệu Ứng" : "Abilities & Mechanics"}</div>
          <div style="font-size:0.9rem;color:#e2e8f0;">${esc(vi ? it.desc_vi : it.desc_en)}</div>
        </div>
        <div class="modal-section">
          <div class="modal-sec-title"><img class="mc-pixel" src="assets/icons/chest_front.png" alt=""/> ${vi ? "Cách Sở Hữu" : "How to Obtain"}</div>
          <div style="font-size:0.9rem;color:#bae6fd;">${esc(vi ? it.obtain_vi : it.obtain_en)}</div>
        </div>
      `;
      document.getElementById("detailModal").classList.add("active");
    }

    function openBossModal(bossId) {
      const b = BOSSES_DATA.find(x => x.id === bossId);
      if (!b) return;
      const vi = currentLang === "vi";
      document.getElementById("modalIcon").src = b.icon;
      document.getElementById("modalTitle").textContent = vi ? b.name_vi : b.name_en;
      document.getElementById("modalSub").textContent = vi ? b.location_vi : b.location_en;
      document.getElementById("modalBadges").innerHTML = `
        <span class="hp-pill">${esc(b.hp)}</span>
        <span class="badge">${esc(PACK_NAMES[b.pack] || b.pack)}</span>
      `;
      const mechs = (vi ? b.mechanics_vi : b.mechanics_en) || [];
      const drops = b.drops || [];
      document.getElementById("modalBody").innerHTML = `
        <div class="modal-section">
          <div class="modal-sec-title"><img class="mc-pixel" src="assets/icons/compass.png" alt=""/> ${vi ? "Vị Trí & Cách Triệu Hồi" : "Location & Summoning"}</div>
          <div style="font-size:0.9rem;color:#e2e8f0;">${esc(vi ? b.summon_vi : b.summon_en)}</div>
        </div>
        <div class="modal-section">
          <div class="modal-sec-title"><img class="mc-pixel" src="assets/icons/netherite_sword.png" alt=""/> ${vi ? "Cơ Chế Chiến Đấu" : "Combat Mechanics & Phases"}</div>
          <ul style="padding-left:18px;font-size:0.88rem;color:#cbd5e1;display:flex;flex-direction:column;gap:6px;">
            ${mechs.map(m => `<li>${esc(m)}</li>`).join("")}
          </ul>
        </div>
        <div class="modal-section">
          <div class="modal-sec-title"><img class="mc-pixel" src="assets/icons/chest_front.png" alt=""/> ${vi ? "Vật Phẩm Rơi Độc Quyền" : "Signature Drops"}</div>
          <div class="badge-row">
            ${drops.map(d => {
              const lbl = esc(vi ? d.label_vi : d.label_en);
              const linked = d.id && CUSTOM_ITEMS_DATA.some(x => x.id === d.id);
              return linked
                ? `<button type="button" class="drop-link-btn" onclick="openItemModal('${esc(d.id)}')">${lbl} ↗</button>`
                : `<span class="drop-static-pill">${lbl}</span>`;
            }).join("")}
          </div>
        </div>
      `;
      document.getElementById("detailModal").classList.add("active");
    }

    function closeDetailModal() {
      document.getElementById("detailModal").classList.remove("active");
    }

    // Wire events
    document.getElementById("itemSearchInput").addEventListener("input", renderItems);
    document.getElementById("itemClearBtn").addEventListener("click", () => {
      document.getElementById("itemSearchInput").value = "";
      renderItems();
    });
    document.getElementById("itemPackSelect").addEventListener("change", renderItems);
    document.getElementById("itemSortSelect").addEventListener("change", renderItems);

    document.querySelectorAll("#itemCategoryChips .chip-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#itemCategoryChips .chip-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentCat = btn.dataset.cat;
        renderItems();
      });
    });

    document.getElementById("bossSearchInput").addEventListener("input", renderBosses);
    document.getElementById("bossClearBtn").addEventListener("click", () => {
      document.getElementById("bossSearchInput").value = "";
      renderBosses();
    });
    document.querySelectorAll("#bossDimChips .chip-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#bossDimChips .chip-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentDim = btn.dataset.dim;
        renderBosses();
      });
    });

    document.getElementById("detailModal").addEventListener("click", e => {
      if (e.target.id === "detailModal") closeDetailModal();
    });
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") closeDetailModal();
    });

    applyLang();
  </script>
</body>
</html>
